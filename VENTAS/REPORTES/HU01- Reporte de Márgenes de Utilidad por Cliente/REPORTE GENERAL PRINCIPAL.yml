docs: |
  # Servicio REST — Márgenes por Cliente

  > **Nota de alcance:** este documento describe **solo los parámetros activos** que
  > el front utiliza actualmente. El servicio expone más parámetros en el
  > `resourceModel` (rangos de zona/vendedor/resp/ruta/giro, filtros de días
  > promedio, descuentos, plazo, flete, subdistribuidores, etc.), pero **ya no se
  > usan**: si se omiten, el programa los normaliza a sus valores por defecto
  > (ver §9).

  ---

  ## 1. Título del Servicio

  **Reporte 01 — Márgenes por Cliente**
  Retorna el análisis de márgenes de venta agrupado por cliente, con opción de detalle por factura/remisión.
  Programa servidor: `ventas-rep001.p` | Basado en: `vtac0090.p`

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Base

  ```
  http://<host>:<puerto>/RestADOSAVentas/rest/RestADOSAVentas/Ventas/Reporte/MargenesPorCliente
  ```

  ---

  ## 4. Parámetros de Entrada (Query String) — ACTIVOS

  > ✅ = Requerido · ❌ = Opcional

  **`FechaInicial`** · DATE · ✅ — Fecha inicial del periodo
  - Formato: `YYYY-MM-DD`

  **`FechaFinal`** · DATE · ✅ — Fecha final del periodo
  - Formato: `YYYY-MM-DD`

  **`Reporte`** · INT · ✅ — Tipo de reporte
  - `1` Resumido (solo `ttMargen`) · `2` Detallado (incluye `ttDetalle`)

  **`Margen`** · INT · ✅ — Base de cálculo del margen
  - `1` Sobre costo · `2` Sobre venta

  **`Seleccionar`** · INT · ✅ — Criterio de selección de clientes
  - `1` General · `2` Zona · `3` Responsable · `4` Vendedor · `5` Agente · `6` Ruta · `7` Giro · `8` Cliente · `9` ListaCte · `10` Contratos

  **`SeleccionarLista`** · STRING · ❌ — CSV de códigos, **según `Seleccionar`**
  - `Seleccionar=8` (Cliente) → Id-Cliente (se autocompleta a 6 dígitos). Ej: `"575,4064"`
  - `Seleccionar=2/3/4/5/6/7/9` → códigos de zona / resp / vendedor / ruta / giro / lista
  - `Seleccionar=1` (General) → **no aplica**, se ignora

  **`IdUser`** · STRING · ✅ — Usuario que ejecuta el reporte
  - Si viene vacío, el servicio responde `IdError=true`, `Respuesta="Enviar Usuario"`

  ---

  ## 5. Body

  No aplica. Método `GET`.

  ---

  ## 6. Headers

  | Header | Valor |
  |--------|-------|
  | `Accept` | `application/json` |

  ---

  ## 7. Ejemplo de Request

  ```
  GET .../Ventas/Reporte/MargenesPorCliente
      ?FechaInicial=2026-08-01
      &FechaFinal=2026-09-01
      &Reporte=1
      &Margen=2
      &Seleccionar=10
      &SeleccionarLista=32269,4064
      &IdUser=olds
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "25 cliente(s) encontrado(s).",
    "dsOutput": {
      "ttMargen": [
        {
          "IdCliente": 4064,
          "RazSoc": "DISTRIBUIDORA EJEMPLO SA DE CV",
          "Iniciales": "JGR",
          "IdSegmento": "D3",
          "Segmento": "DISTRIBUIDOR",
          "Sel": "NORTE",
          "IdZona": 3,
          "Condicion": "Credito",
          "Limite": 50000,
          "Plazo": 30,
          "DesCtdo": 2.0,
          "Factor": 0.0,
          "DescPP1": "2.5,1.5",
          "FletePag": false,
          "DPromPago": 28.4,
          "DPromCart": 32.1,
          "Importe": 148250.00,
          "Descto": 7412.50,
          "PorDes": -5.00,
          "Neto": 140837.50,
          "Costo": 112670.00,
          "Dif": 28167.50,
          "ImpFlete": 0.00,
          "Margen": 20.00,
          "Orden": 1
        }
      ],
      "ttDetalle": []
    }
  }
  ```

  > `ttDetalle` solo trae registros cuando `Reporte=2`. Con `Reporte=1` (grid) se retorna vacío.

  ### Campos de `ttMargen`

  **`IdCliente`** · INT — Clave del cliente
  **`RazSoc`** · STRING — Razón social
  **`Iniciales`** · STRING — Iniciales del vendedor asignado
  **`IdSegmento`** · STRING — Clave del segmento de distribución
  **`Segmento`** · STRING — Descripción del segmento
  **`Sel`** · STRING — Descripción de la **zona** del cliente (etiqueta de display)
  **`IdZona`** · INT — Clave de zona
  **`Condicion`** · STRING — `"Contado"` o `"Credito"` según límite/plazo del cliente
  **`Limite`** · INT — Límite de crédito
  **`Plazo`** · INT — Plazo de crédito (días)
  **`DesCtdo`** · DECIMAL — % descuento contado
  **`Factor`** · DECIMAL — Factor fijo de descuento
  **`DescPP1`** · STRING — Descuentos pronto pago en formato `"pp1,pp2"`
  **`FletePag`** · BOOLEAN — `true` = cliente paga flete
  **`DPromPago`** · DECIMAL — Días promedio de pago (1 decimal)
  **`DPromCart`** · DECIMAL — Días promedio de cartera (1 decimal)
  **`Importe`** · DECIMAL — Importe bruto de ventas del periodo
  **`Descto`** · DECIMAL — Total de descuentos aplicados
  **`PorDes`** · DECIMAL — % de descuento promedio
  **`Neto`** · DECIMAL — Importe neto (Importe − Descto)
  **`Costo`** · DECIMAL — Costo total de lo vendido
  **`Dif`** · DECIMAL — Diferencia Neto − Costo
  **`ImpFlete`** · DECIMAL — Importe de flete cargado
  **`Margen`** · DECIMAL — % de margen según `Margen` (sobre costo o sobre venta)
  **`Orden`** · INT — Secuencia de salida ya ordenada (ver §9, orden por selección)

  ### Campos de `ttDetalle` *(solo cuando `Reporte=2`)*

  **`IdCliente`** · INT — Clave del cliente
  **`IdFactura`** · STRING — Número de factura o remisión
  **`FecReg`** · DATE — Fecha del documento
  **`Factor`** · STRING — `"F"` si se aplicó precio factor
  **`FletePag`** · BOOLEAN — `true` = documento incluye flete
  **`Importe`** · DECIMAL — Importe bruto del documento
  **`Descto`** · DECIMAL — Descuento aplicado
  **`PorDes`** · DECIMAL — % de descuento
  **`Neto`** · DECIMAL — Neto del documento
  **`Costo`** · DECIMAL — Costo del documento
  **`Dif`** · DECIMAL — Diferencia Neto − Costo
  **`ImpFlete`** · DECIMAL — Importe de flete del documento
  **`Margen`** · DECIMAL — % de margen del documento

  ### Response de error / vacío

  ```json
  { "IdError": true, "Respuesta": "Enviar Usuario", "dsOutput": { "ttMargen": [], "ttDetalle": [] } }
  { "IdError": true, "Respuesta": "No se encontraron Registros", "dsOutput": { "ttMargen": [], "ttDetalle": [] } }
  ```

  ---

  ## 9. Observaciones Técnicas

  1. **Fechas:** en formato `YYYY-MM-DD`; el AppServer OpenEdge las convierte a `DATE`.

  2. **Parámetros omitidos = valores por defecto.** Al enviar solo los activos, el
     programa normaliza el resto así:
     - Ubicación (`Zonas`) = **General**
     - Condición de venta = **Todos** (contado + crédito)
     - Orden = **Alfabético**
     - Selectivo = **Todos** · SubDistribuidores = **General**
     - Todos los filtros numéricos (importe mínimo, descuentos, plazos, días
       promedio, flete) = **0 (sin filtro)**

  3. **`SeleccionarLista` depende de `Seleccionar`.** Es el CSV de códigos del
     criterio elegido. Con `Seleccionar=1` (General) no se usa.

  4. **Orden de la salida (`Orden`).** Las filas se agrupan por el criterio de
     `Seleccionar` y dentro se ordenan alfabéticamente (o por ventas descendente),
     **igual que la pantalla carácter** (`vtac0090`, `BREAK BY Sel`):
     - `Seleccionar=1` (General): orden alfabético por razón social.
     - `Seleccionar=10` (Contratos): **agrupado por contrato** (titular + asociados
       juntos), luego por razón social.
     - `Seleccionar=2/3/4/5/6/7`: agrupado por zona / resp / vendedor / ruta / giro.

  5. **Margen sobre costo vs. sobre venta:**
     - `Margen=1` → `((Neto − Costo) / Costo) × 100`
     - `Margen=2` → `(1 − (Costo / (Neto))) × 100`  *(sobre venta)*

  6. **Modo resumido vs. detallado:** con `Reporte=1` el servicio omite el llenado
     de `ttDetalle` para optimizar el tiempo de respuesta.

  7. **Clientes excluidos:** se excluyen automáticamente los clientes internos
     (`Id-Cliente` 1, 2, 4). El `Id-Cliente=3` (Mostrador) entra en contado.

  8. **`Respuesta`:** en éxito devuelve `"<N> cliente(s) encontrado(s)."`.

  ---

  **Desarrollado por:** SIS10 - JASS
