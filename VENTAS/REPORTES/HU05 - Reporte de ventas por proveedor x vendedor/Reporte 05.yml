        "Importe2Ant": 30100.00,
        "TotImpAnt": 140350.00,
        "PListaAnt": 149800.00
      }
    ],
    "ttDet": [
      {
        "IdVendedor": "0077",
        "IdUbic": "01",
        "IdArticulo": "021118",
