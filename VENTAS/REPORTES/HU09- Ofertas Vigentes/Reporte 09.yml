  ---

  ## 13. Observaciones Técnicas

  1. **Fuente de datos:** El servicio consulta directamente la tabla `ArtOfer` usando el índice `idx-Pres`. La estrategia de acceso es idéntica al programa carácter `cnfa0590.p`.
  2. **Color `TODOS`:** Cuando `ArtOfer.Id-Color = 0`, el artículo aplica a todos los colores disponibles. El campo `NomColor` retorna `"TODOS"` en este caso.
  3. **Sin filtro de vigencia:** El servicio **no filtra** por `FecIni` / `FecFin` — retorna todos los artículos registrados en la oferta, incluyendo vencidos. El front-end es responsable de filtrar por vigencia si se requiere.
  4. **Ofertas en mayúsculas:** La clave `IdOfer` en la base de datos está en mayúsculas (ej. `"ENERO"`). El parámetro `IdOfer` es sensible a mayúsculas/minúsculas según el motor OpenEdge.
  5. **Autenticación:** El servicio corre sobre OpenEdge PASOE. Si el ambiente requiere autenticación Bearer, incluir el header `Authorization: Bearer <token>`.
  6. **Proveedor del artículo (Ticket #3201):** Por cada renglón se resuelve el proveedor vía `Articulo.Id-Prov` → `Prov.Nombre`. Para no relanzar el `FIND Prov` por cada artículo, el nombre se **cachea** en un temp-table por `Id-Prov` (los artículos suelen repetir proveedor), evitando demorar la consulta. Si el artículo no se localiza, `IdProv` retorna `0` y `NomProv` vacío.
