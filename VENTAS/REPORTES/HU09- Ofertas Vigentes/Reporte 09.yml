docs: |
  # Servicio REST — Consulta de Artículos en Oferta

  ---

  ## 1. Título del Servicio

  **Reporte 10 — Consulta de Artículos en Oferta (OfertasVigentes)**
  Retorna los artículos registrados en una oferta específica, incluyendo presentación, color, porcentajes de descuento, vigencia, y estatus. Permite consultar todas las ofertas o filtrar por clave de oferta.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8850/RestADOSAVentas/rest/RestADOSAVentas/Ventas/Reporte/OfertasVigentes
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`IdOfer`** · STRING · ❌ — Clave de la oferta a consultar
  - Vacío o sin parámetro = retorna **todas** las ofertas
  - Ej: `"ENERO"` · `"PROMO1"` · `"VERANO24"`

  ---

  ## 5. Body

  No aplica. Método `GET`.

  ---

  ## 6. Headers

  | Header         | Valor                                  |
  |----------------|----------------------------------------|
  | `Accept`       | `application/json`                     |
  | `Content-Type` | `application/json` *(opcional en GET)* |

  ---

  ## 7. Ejemplo de Request

  ```
  GET http://192.0.1.14:8850/RestADOSAVentas/rest/RestADOSAVentas/Ventas/Reporte/OfertasVigentes
      ?IdOfer=enero
  ```

  ### Consultar todas las ofertas (sin filtro):

  ```
  GET http://192.0.1.14:8850/RestADOSAVentas/rest/RestADOSAVentas/Ventas/Reporte/OfertasVigentes
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "3 registros encontrados.",
    "dsOutput": {
      "ttArch": [
        {
          "IdOfer": "ENERO",
          "IdArticulo": "ART001",
          "Descr": "ACEITE MOTOR 5W30 1L",
          "IdProv": 1234,
          "NomProv": "LUBRICANTES DEL NORTE SA DE CV",
          "IdPres": 1,
          "IdColor": 0,
          "NomColor": "TODOS",
          "PorcMay": 10.00,
          "PorcPro": 5.00,
          "FecIni": "2026-01-01",
          "FecFin": "2026-01-31",
          "Contado": false,
          "NoPP": false,
          "Activo": true
        },
        {
          "IdOfer": "ENERO",
          "IdArticulo": "ART045",
          "Descr": "FILTRO DE AIRE UNIVERSAL",
          "IdProv": 5678,
          "NomProv": "REFACCIONES INDUSTRIALES SA",
          "IdPres": 1,
          "IdColor": 3,
          "NomColor": "ROJO",
          "PorcMay": 8.00,
          "PorcPro": 4.00,
          "FecIni": "2026-01-01",
          "FecFin": "2026-01-31",
          "Contado": true,
          "NoPP": false,
          "Activo": true
        }
      ]
    }
  }
  ```

  ### Campos de `ttArch`

  **`IdOfer`** · STRING — Clave de la oferta (ej. `"ENERO"`, `"VERANO24"`)
  **`IdArticulo`** · STRING — Clave del artículo en oferta
  **`Descr`** · STRING — Descripción del artículo tal como aparece en la oferta
  **`IdProv`** · INT — Número de proveedor del artículo (`Articulo.Id-Prov`); `0` si el artículo no existe o no tiene proveedor
  **`NomProv`** · STRING — Nombre del proveedor (`Prov.Nombre`); vacío si no se localiza
  **`IdPres`** · INT — Clave de la presentación del artículo
  **`IdColor`** · INT — Clave de color; `0` = sin color asignado (aplica a todos los colores)
  **`NomColor`** · STRING — Abreviatura del color (tabla `Kolor`); `"TODOS"` cuando `IdColor = 0`
  **`PorcMay`** · DECIMAL — Porcentaje de descuento para clientes mayoreo
  **`PorcPro`** · DECIMAL — Porcentaje de descuento para clientes promoción
  **`FecIni`** · DATE — Fecha de inicio de vigencia de la oferta
  **`FecFin`** · DATE — Fecha de fin de vigencia de la oferta
  **`Contado`** · BOOLEAN — `true` = oferta aplica solo a ventas de contado; `false` = aplica a crédito y contado
  **`NoPP`** · BOOLEAN — `true` = no aplica precio de proveedor; `false` = precio de proveedor permitido
  **`Activo`** · BOOLEAN — `true` = oferta activa; `false` = oferta inactiva

  > Los registros se retornan ordenados por `idx-Pres` (índice de presentación de `ArtOfer`).
  > El campo `NomColor` siempre retorna `"TODOS"` cuando `IdColor = 0`, independientemente del valor en la base de datos.

  ### Response de error controlado

  ```json
  {
    "IdError": true,
    "Respuesta": "Error: tabla ArtOfer no disponible.",
    "dsOutput": {
      "ttArch": []
    }
  }
  ```

  ---

  ## 9. Validaciones del Servicio

  | Condición | Comportamiento |
  |-----------|----------------|
  | `IdOfer` vacío o no enviado | Retorna **todos** los artículos en oferta sin filtrar |
  | `IdOfer` con valor | Filtra exclusivamente por esa clave de oferta |
  | `IdOfer = ?` (null PASOE) | Se normaliza a vacío — retorna todas las ofertas |
  | No existen registros para el `IdOfer` indicado | Retorna `ttArch: []` con `IdError: false` y `"0 registros encontrados."` |

  ---

  ## 10. Evidencia de Ejecución

  *Pendiente de captura por parte del equipo de QA.*
  Adjuntar screenshot de la herramienta de prueba (Bruno / Postman / curl) mostrando:
