docs: |
  # Márgenes Dinámicos — Por UbiVta (HU31)

  Mismo endpoint `GET /Ventas/Reporte/MargenesDinamico` con `Agrupar=6`.
  `IdGrupo` = Id-Ubic del comprobante, `DescrGrupo` = `UbiVta.Descr`.
  `Lista` vacía = todas las ubicaciones; o CSV ej. `MLO,COM`.

  Documentación completa: request **Por Vendedor** de esta misma carpeta, o `RestADOSAVentas/Docs/ventas-rep031-MargenesDinamico.md`.
