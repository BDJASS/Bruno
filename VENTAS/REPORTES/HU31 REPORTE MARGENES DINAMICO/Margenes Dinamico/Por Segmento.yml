docs: |
  # Márgenes Dinámicos — Por Segmento (HU31)

  Mismo endpoint `GET /Ventas/Reporte/MargenesDinamico` con `Agrupar=7`.
  `IdGrupo` = `Cliente.Id-Segmento`, `DescrGrupo` = `Segmento.Descr`.
  Solo clientes con segmento asignado. `Lista` vacía = todos; o CSV ej. `DIST01,DIST02` (mayúsculas; cada segmento debe existir).

  Documentación completa: request **Por Vendedor** de esta misma carpeta, o `RestADOSAVentas/Docs/ventas-rep031-MargenesDinamico.md`.
