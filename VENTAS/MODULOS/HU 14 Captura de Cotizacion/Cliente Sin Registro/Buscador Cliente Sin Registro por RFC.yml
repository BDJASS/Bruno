docs: |
  # Servicio REST — Cliente Sin Registro (Cliente 3): Buscador por RFC

  ---

  ## 1. Título del Servicio

  **Cliente Sin Registro — Buscador / Autocompletado por RFC** *(ticket 3572)*
  En la captura de **cotización** o de **pedido** con el **cliente 3**, mientras el usuario teclea el **RFC**, regresa los **clientes sin registro** cuyo RFC **empieza** con lo capturado. El usuario elige uno y se cargan sus datos sin capturarlos de nuevo.

  > No aplica para el **RFC genérico** (`XAXX010101000`): nunca aparece en los resultados.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Cliente/SinRegistro/Buscar
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional · Se quitan espacios y guiones y se pasa a mayúsculas

  **`RFC`** · STRING · ✅ — Texto parcial del RFC
  - Mínimo **3 caracteres**; con menos no busca (lista vacía)

  ---

  ## 5. Body

  No aplica. Método `GET`.

  ---

  ## 6. Headers

  | Header   | Valor              |
  |----------|--------------------|
  | `Accept` | `application/json` |

  ---

  ## 7. Ejemplo de Request

  ```
  GET .../Cliente/SinRegistro/Buscar?RFC=GOM
  ```

  ---

