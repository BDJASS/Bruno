  **`IdError`** · BOOLEAN — `true` solo si ocurrió un error
  **`Respuesta`** · STRING — Resultado de la búsqueda
  **`ttCteSinReg`** (0..20) — Coincidencias; mismos campos que la consulta por RFC
  **`BlqDev`** · BOOLEAN — `true` = RFC bloqueado por créditos (no se debe usar)

  ### Sin coincidencias / pocos caracteres

  ```json
  { "IdError": false, "Respuesta": "No se encontraron clientes sin registro con RFC que inicie con ZZZ.", "dsCteSinReg": { "ttClienteRFC": [], "ttCteSinReg": [] } }
  { "IdError": false, "Respuesta": "Capture al menos 3 caracteres del RFC.", "dsCteSinReg": { "ttClienteRFC": [], "ttCteSinReg": [] } }
  ```

  ---

  ## 9. Validaciones del Servicio

  | Condición | Comportamiento |
  |-----------|----------------|
  | Menos de 3 caracteres o vacío | Lista vacía — `Capture al menos 3 caracteres del RFC.` |
  | Sin coincidencias | Lista vacía — `No se encontraron clientes sin registro con RFC que inicie con X.` |
  | Más de 20 coincidencias | Regresa las primeras 20 y pide capturar más caracteres |
  | RFC genérico | Nunca se incluye en los resultados |

  ---

  ## 10. Reglas de Negocio para el Front

  1. Llamar con **cliente 3** a partir de **3 caracteres** de RFC, con una espera breve entre teclas.
  2. Mostrar cada coincidencia como **RFC — Razón social — Población**.
  3. Al elegir una: si `BlqDev = true`, mostrar "RFC Bloqueado, comunicar al cliente con el departamento de créditos." y no continuar; si no, cargar sus datos y tratarlo como cliente sin registro **existente** (si se modifica, guardar con **PUT**).
  4. Sin coincidencias o sin elegir: seguir con la consulta por RFC y el alta (**POST**).
  5. Con el RFC genérico (o Enter sin capturar) **no buscar**.

  ---

  ## 11. Evidencia de Ejecución

  *Pendiente de captura por parte del equipo de QA.*

  ---

  ## 12. Fecha de Prueba

  | Ambiente | Fecha         | Ejecutado por |
  |----------|---------------|---------------|
  | DEV      | *(pendiente)* | *(pendiente)* |

  ---

  ## 13. Resultado

  | Estado              | Descripción                                    |
  |---------------------|------------------------------------------------|
  | ⏳ Pendiente prueba | Servicio nuevo, pendiente de despliegue en DEV. |

  ---

  ## 14. Observaciones Técnicas

  1. La búsqueda usa el inicio del RFC, por lo que es rápida aunque la tabla sea grande; nunca regresa el catálogo completo.
  2. Registros antiguos guardados con espacios o guiones dentro del RFC pueden no aparecer en el autocompletado; la consulta por RFC completo sí los encuentra.
  3. La búsqueda por razón social es otro requerimiento (ticket 3725).

