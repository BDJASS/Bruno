docs: |
  # Servicio REST — Cliente Sin Registro (Cliente 3): Modificación

  ---

  ## 1. Título del Servicio

  **Cliente Sin Registro — Modificación (PUT)**
  Modifica un **cliente sin registro** (cliente 3) existente con los datos del modal "Modificación de dirección de Cliente sin Registro". Solo procede si el RFC **ya existe**; si no existe se rechaza y se debe usar el **alta (POST)** en la misma URL.

  > El **RFC es la llave**: identifica el registro y **no se cambia**; se editan los demás campos.

  Se basó en el proceso de modificación de cliente sin registro del call center legado, con las mismas validaciones del modal.

  ---

  ## 2. Método HTTP

  ```
  PUT
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Cliente/SinRegistro/Guardar
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  No aplica.

  ---

  ## 5. Body — `dsCteSinRegAlta.ttCteSinRegAlta` (1 registro)

  > ✅ = Requerido · ❌ = Opcional · Mismo body que el alta (POST) · Los textos se guardan en MAYÚSCULAS

  **`RFC`** · STRING · ✅ — RFC del cliente sin registro a modificar (llave; no se cambia)
  - Vacío o `XAXX010101000` = público en general: **no hace nada** (no valida, no edita); responde `IdError = false`, `Accion = PUBLICO`
  **`RazonSocial`** · STRING · ✅ — Razón social
  **`Propietario`** · STRING · ❌ — Propietario / atención
  **`CalleNo`** · STRING · ✅ — Calle y número
  **`Colonia`** · STRING · ❌ — Colonia

  **`IdCiudad`** · INT · ✅ — Población (catálogo de ciudades)
  - El **estado** se toma de la población; no se envía

  **`CP`** · STRING · ✅ — 5 dígitos
  **`Tel`** · STRING · ❌ — Teléfono
  **`Fax`** · STRING · ❌ — Fax

  **`Email`** · STRING · ❌ — Correo(s) separados por `;`
  - Se guarda como **correo** y como **buzón fiscal** (igual que el legado)

  **`IdUsoCFDI`** · STRING · ❌ — Uso de CFDI; vacío = no se cambia
  **`IdRFiscal`** · STRING · ❌ — Régimen fiscal; si viene debe existir; vacío = no se cambia
  **`Iniciales`** · STRING · ❌ — Usuario que captura

  ---

  ## 6. Headers

  | Header         | Valor              |
  |----------------|--------------------|
  | `Content-Type` | `application/json` |
  | `Accept`       | `application/json` |

  ---

  ## 7. Ejemplo de Request

  Ver el body de este request.

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Cliente sin registro modificado.",
    "Accion": "MODIFICACION",
    "dsCteSinReg": {
      "ttCteSinReg": [
        {
          "RFC": "GOMJ800101AB1",
          "RazonSocial": "JUAN GOMEZ MARTINEZ",
          "Propietario": "JUAN GOMEZ",
          "CalleNo": "AV. JUAREZ 250",
          "Colonia": "CENTRO",
          "IdCiudad": 1,
          "Ciudad": "HERMOSILLO",
          "IdEstado": "SON",
          "Estado": "SONORA",
          "Pais": "MEXICO",
          "CP": "83000",
          "Tel": "6629876543",
          "Fax": "",
          "Email": "JUAN@CORREO.COM;FACTURAS@CORREO.COM",
          "BuzonFiscal": "JUAN@CORREO.COM;FACTURAS@CORREO.COM",
          "IdUsoCFDI": "G03",
          "IdRFiscal": "612",
          "DescrRFiscal": "PERSONAS FISICAS CON ACTIVIDADES EMPRESARIALES",
          "FEFormaPago": "01",
          "FEDigitosCuenta": "",
          "NomEmpresa": "",
          "BlqDev": false,
          "PorcIVA": 16,
          "Plazo": 0
        }
      ]
    }
  }
  ```

  **`IdError`** · BOOLEAN — `true` = no se guardó
  **`Respuesta`** · STRING — Mensaje del resultado
  **`Accion`** · STRING — `MODIFICACION` · `ALTA` (el RFC no existe → usar POST) · `BLOQUEADO`
  **`ttCteSinReg`** — Registro guardado (mismos campos que la consulta por RFC)

  ### Response de error controlado (RFC no existe)

  ```json
  {
    "IdError": true,
    "Respuesta": "No existe el cliente sin registro GOMJ800101AB1; para darlo de alta use el alta (POST).",
    "Accion": "ALTA",
    "dsCteSinReg": { "ttCteSinReg": [] }
  }
  ```

  ---

  ## 9. Validaciones del Servicio

  | Condición | Mensaje |
  |-----------|---------|
  | RFC no registrado | `No existe el cliente sin registro X; para darlo de alta use el alta (POST).` |
  | Registro en uso por otro usuario | `El cliente sin registro esta siendo modificado por otro usuario, intente de nuevo.` |
  | Longitud del RFC | `El RFC debe tener 12 o 13 caracteres.` |
  | Formato del RFC | `El formato del RFC es incorrecto.` |
  | RFC bloqueado | `RFC Bloqueado, comunicar al cliente con el departamento de creditos.` |
  | Sin razón social | `Teclee la Razon Social del cliente.` |
  | Sin calle y número | `Teclee el domicilio del cliente.` |
  | CP distinto de 5 dígitos | `El CP debe contener cinco digitos.` |
  | Sin población | `Debe seleccionar una poblacion.` |
  | Población inexistente | `No existe la ciudad en catalogo.` |
  | Correo inválido | `Correo electronico invalido, debe corregirlo o borrarlo.` |
  | Régimen fiscal inexistente | `No existe el regimen fiscal X.` |

  ---

  ## 10. Reglas de Negocio para el Front

  1. Usar este servicio cuando la consulta por RFC regresó `Accion = MODIFICACION` (modal con los datos precargados).
  2. El campo **RFC** del modal va **bloqueado**: es la llave del registro.
  2a. **Público en general** (RFC vacío o `XAXX010101000`): **no llamar** a este servicio; los datos del modal van solo en la cotización o el pedido. Si se llama, no hace nada (`Accion = PUBLICO`).
  3. Si responde `IdError = true` con `Accion = ALTA`, el RFC no existe: guardar con **POST**.
  4. Con `IdError = false`, mandar los datos de `ttCteSinReg` en el encabezado del alta de cotización o de pedido.

  ---

  ## 11. Evidencia de Ejecución

  *Pendiente de captura por parte del equipo de QA.*

  ---

  ## 12. Fecha de Prueba

  | Ambiente | Fecha         | Ejecutado por |
  |----------|---------------|---------------|
  | DEV      | *(pendiente)* | *(pendiente)* |

  ---

  ## 13. Resultado

  | Estado              | Descripción                                    |
  |---------------------|------------------------------------------------|
  | ⏳ Pendiente prueba | Servicio nuevo, pendiente de despliegue en DEV. |

  ---

  ## 14. Observaciones Técnicas

  1. Mismas validaciones y body que el alta (POST); solo cambia el verbo.
  2. A diferencia del legado, la modificación también actualiza el buzón fiscal y el uso de CFDI.
  3. Si otro usuario tiene el registro bloqueado, no se espera: se avisa para intentar de nuevo.

  ---
