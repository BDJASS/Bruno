  ---

  ## 14. Observaciones Técnicas

  1. **Tipo 1, número (prefijo):** se recorren los rangos `[n, n]`, `[n·10, n·10+9]`, `[n·100, n·100+99]`, … hasta el último cliente, con `USE-INDEX idx-abcvendmail` (`Activo` + `Id-Cliente`): solo se leen clientes activos dentro del rango y se corta al llegar a `MaxReg`.
  2. **Paso 1 — empiezan con el texto (por índice):** razón social con `USE-INDEX Idx-RazonClie` (`RazonSocial`, `Id-Cliente`); teléfono con `USE-INDEX Idx-Tel1` (`Tel1`, `Id-Cliente`); RFC con `BEGINS` **sin** `USE-INDEX` (`idx-RFC` e `idx-abrvrfc` son de un campo y no se sabe si alguno es word-index), validando `Activo` en el ciclo; correo con el **word-index** `idx-email` (`CONTAINS "<primera palabra>*"` + `INDEX`), porque no admite `USE-INDEX` ni `BEGINS` (error 3594).
  3. **Paso 2 — contienen el texto (recorrido):** `RazonSocial`, `Tel1` y `RFC` no tienen word-index (en `RazonSocial` `CONTAINS` da error 3398), así que se recorren los clientes activos (`USE-INDEX idx-abcvendmail`) con `FIELDS (Id-Cliente Activo RazonSocial e-mail Tel1 RFC)` y se compara con `INDEX` solo el campo del tipo: razón social = todas las palabras; correo = texto completo; teléfono = solo dígitos en ambos lados; RFC = sin espacios ni guiones en ambos lados. Al coincidir se relee el registro completo por `ROWID`. Se corta al llenar `MaxReg`; el peor caso (pocas o ninguna coincidencia) lee todos los activos.
  4. **Sin repetir clientes:** `CAN-FIND` en `ttCliente` antes de agregar. Sin distinguir mayúsculas.
  5. **Orden de salida:** por `Id-Cliente` (índice primario de `ttCliente`).
  6. **Salida ligera:** `ttCliente` propio de 6 campos (ya no usa `{cliente.i}`); no se consultan `Ciudad`/`Estado`/`Pais`/`Zona` ni se relee el registro: el recorrido con `FIELDS` ya trae los 6 campos. `PassInternet` nunca sale.
  7. **Sin auditoría** (`programas/auditoria.p`) a propósito: el front lo llama mientras se teclea.
  8. **Autenticación:** servicio sobre OpenEdge PASOE; si el ambiente requiere Bearer, incluir `Authorization: Bearer <token>`.

  ---
  **Desarrollado por:** SIS10 - JASS
