docs: |
  # Servicio REST — Envío de Cotización por Correo con PDF del Front

  ---

  ## 1. Título del Servicio

  **Enviar Cotización por Correo con PDF recibido (EnviaCorreoPdf)**
  Recibe en el body el PDF de la cotización **ya generado por el front** en Base64, lo valida, lo adjunta al correo y lo envía. El servidor **no genera el PDF** (no ejecuta `htmltopdf`, que representaba ~95 % del tiempo del envío anterior).
  Programa servidor: `cotizaenv.p` · Procedimiento: `envcorreopdf` | El correo lo arma y envía `sisd0502.p`.

  > Flujo anterior (respaldo, sin cambios): [cotizaenv-EnviaCotizacionCorreo.md](cotizaenv-EnviaCotizacionCorreo.md) — `envcorreo`, genera el PDF en el servidor.

  ---

  ## 2. Método HTTP

  ```
  POST
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/GestionCotizacion/EnviaCorreoPdf
  ```

  ---

  ## 4. Parámetros de Entrada

  > ✅ = Requerido · ❌ = Opcional · Todo viaja en el body (dataset `dsCorreoPdf`, **un solo registro** en `ttCorreoPdf`)

  **`IdCotiza`** · STRING · ✅ — Folio de la cotización. Debe existir y estar **autorizada**

  **`Mail`** · STRING · ✅ — Correo(s) destino. Varios separados por `,` (también acepta `;`); se limpian, deduplican y validan

  **`Contenido`** · STRING · ❌ — Comentario del vendedor que se muestra en el cuerpo del correo

  **`IdUser`** · STRING · ✅ — Usuario que envía (auditoría)

  **`PdfB64`** · STRING (Base64) · ✅ — PDF completo de la cotización en Base64
  - Acepta con o sin prefijo `data:application/pdf;base64,` · Se ignoran saltos de línea y espacios
  - Debe decodificar a un archivo que empiece con `%PDF`

  ---

  ## 5. Body (dataset `dsCorreoPdf`)

  ```json
  {
    "dsCorreoPdf": {
      "ttCorreoPdf": [
        {
          "IdCotiza": "2153662",
          "Mail": "desarrollo10@adosa.com.mx,desarrollo8@adosa.com.mx",
          "Contenido": "PRUEBA DE CORREOS DOBLE CC",
          "IdUser": "jass",
          "PdfB64": "JVBERi0xLjQKMSAwIG9iago8PAovVGl0bGUg..."
        }
      ]
    }
  }
  ```

  ---

  ## 6. Headers

  | Header         | Valor                |
  |----------------|----------------------|
  | `Accept`       | `application/json`   |
  | `Content-Type` | `application/json`   |

  ---

  ## 7. Ejemplo de Response

  El dataset se regresa **vacío** (no se devuelve el PDF).

  ### Éxito

  ```json
  {
    "dsCorreoPdf": {},
    "IdError": false,
    "Respuesta": "Cotizacion 2153662 enviada a los correos correctamente."
  }
  ```

  ### Error controlado

  ```json
  {
    "dsCorreoPdf": {},
    "IdError": true,
    "Respuesta": "El archivo recibido no es un PDF valido."
  }
  ```

  ---

  ## 8. Validaciones del Servicio

  | Condición | `Respuesta` (`IdError: true`) |
  |-----------|-------------------------------|
  | Temporal sin registros | *"No se recibieron los datos de la cotizacion a enviar."* |
  | Más de un registro | *"Solo se puede enviar una cotizacion por solicitud."* |
  | `IdUser` vacío | *"Se requiere el usuario (IdUser)."* |
  | `IdCotiza` vacío | *"El numero de cotizacion no puede estar vacio."* |
  | `Mail` vacío | *"La cuenta de correo electronico no puede estar vacia."* |
  | Un correo con formato inválido | *"La cuenta de correo electronico `<correo>` no tiene el formato adecuado."* |
  | Cotización no existe | *"La cotizacion indicada no existe."* |
  | Cotización no autorizada | *"Cotizacion no autorizada, imposible enviar por correo."* |
  | `PdfB64` vacío | *"Se requiere el PDF de la cotizacion."* |
  | Base64 inválido o no es PDF (`%PDF`) | *"El archivo recibido no es un PDF valido."* |
  | El servidor de correo no aceptó el mensaje | *"No fue posible enviar el correo de la cotizacion `<folio>`. Intente nuevamente."* |
  | Error inesperado | *"Error al enviar la cotizacion por correo: `<detalle>`"* |

  Éxito (`IdError: false`): *"Cotizacion `<folio>` enviada al correo correctamente."* (o *"a los correos"* si son varios).

  ---

  ## 9. Evidencia de Ejecución

  *Pendiente de captura por parte del equipo de QA.*

  ---

  ## 10. Fecha de Prueba

  | Ambiente | Fecha         | Ejecutado por |
  |----------|---------------|---------------|
  | DEV      | *(pendiente)* | *(pendiente)* |

  ---

  ## 11. Resultado

  | Estado              | Descripción |
  |---------------------|-------------|
  | ⏳ Pendiente prueba | Endpoint nuevo. Pendiente de compilar, mapear en el binding REST y probar. |

  ---

  ## 12. Observaciones Técnicas

  1. **Sin generación en servidor:** el PDF lo produce el front; el servidor solo decodifica (`BASE64-DECODE`), valida la firma `%PDF` y adjunta. Elimina el paso `htmltopdf` (~4–5 s medidos en DEV).
  2. **Envío confirmado:** `IdError: false` solo si el servidor SMTP aceptó el mensaje (`sisd0502.p` regresa el resultado de `correo01cc.p`). Si falla no se reintenta automáticamente para no duplicar correos al cliente; el front puede reintentar.
  3. **Mismo correo que el flujo anterior:** remitente usuario `CORREO`, Reply-To vendedor, DEV/PROD con `programas/desarrollo.flag`, en PROD CC vendedor y CCO sistemas (`^B`), adjuntos `Cotizacion_<folio>.pdf` + `Publicidad.jpg`.
  4. **Concurrencia:** el PDF se graba como `/usr2/compartido/cotiza/<folio>-<hora>-<UUID>.pdf` (único por solicitud) y se borra al terminar, junto con su copia codificada `b64-*.pdf` del directorio temporal de `smtpmailcc.p`.
  5. **Contenido del PDF:** el servidor confía en que el PDF corresponde al folio enviado; no lo compara contra la BD.
  6. **Respaldo:** `envcorreo` (`/GestionCotizacion/EnviaCorreo`) y `sisd0500.p` quedan intactos.

  ---
  **Desarrollado por:** SIS10 - JASS
