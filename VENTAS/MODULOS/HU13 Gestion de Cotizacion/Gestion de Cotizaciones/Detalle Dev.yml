  ### Campos de `ttClienteDet` (1 registro — datos del cliente)

  **`IdCliente`** · INT — Clave del cliente
  **`RazonSocial`** · STRING — Razón social
  **`RFC`** · STRING — RFC del cliente
  **`Telefono`** · STRING — Teléfono principal (`Tel1`)
  **`IdVendedor`** · STRING — Clave del vendedor del cliente
  **`VendNombre`** · STRING — Nombre del empleado vendedor; vacío si no se localizó
  **`Direccion`** · STRING — Dirección compuesta: calle, colonia, ciudad, estado y C.P.

  ### Campos de `ttCondVenta` (1 registro — condiciones de venta)

  **`IdCot`** · STRING — Folio de la cotización
  **`FecReg`** · DATE — Fecha de registro
  **`Hora`** · STRING — Hora de registro (`HH:MM:SS`)
  **`Vencimiento`** · DATE — Fecha de vencimiento (`FecReg` + días de vigencia)
  **`DiasEnt`** · INT — Días de entrega
  **`Plazo`** · INT — Plazo de crédito (días); `0` = contado
  **`LAB`** · STRING — Lugar de entrega / LAB
  **`TipoPrecio`** · STRING — Tipo de precio
  **`DescPP`** · DECIMAL — Descuento por pronto pago (%)
  **`DescPP2`** · DECIMAL — Segundo descuento por pronto pago (%)
  **`PrecioTemp`** · BOOLEAN — `true` = maneja precios de temporada
  **`TipoFactor`** · STRING — Tipo de factor (`FI`, `FD`, `FC` o vacío)
  **`Vigencia`** · INT — Días de vigencia de la cotización
  **`Autorizada`** · BOOLEAN — `true` = autorizada
  **`AutPor`** · STRING — Usuario que autorizó
  **`Cancelado`** · BOOLEAN — `true` = cancelada
  **`SubTotal`** · DECIMAL — Subtotal de la cotización (`Cot.SubTotal`) *(ticket 3439)*
  **`IVA`** · DECIMAL — IVA de la cotización (`Cot.IVA`), suma del IVA real de cada partida; los productos exentos aportan 0 *(ticket 3439)*
  **`Tot`** · DECIMAL — Total de la cotización (`Cot.Tot`); es el mismo que muestran el grid de consulta y el PDF *(ticket 3439)*
  **`MargenBruto`** · DECIMAL — Margen bruto (%) de la cotización completa — el "M1" de la autorización de cotizaciones (`vtaa0070.p`). Redondeado a 2 decimales; puede ser negativo. Solo se calcula para usuarios autorizados (ver sección 13); para el resto se retorna `0`. Si la cotización se creó con el cambio de márgenes grabados (`Cot.TotCosto > 0`) se toma de **`Cot.MargenC`**; en cotizaciones anteriores se calcula al vuelo con la misma fórmula
  **`MargenV`** · DECIMAL — Margen (%) de la cotización **sobre venta**: `(1 − Σ costo×cant / Σ Importe) × 100` (equivale a `MargenBruto / (100 + MargenBruto) × 100`; ej. 12.5 % sobre costo = 11.11 % sobre venta). Se toma de **`Cot.MargenV`** (grabado en el alta) o al vuelo en cotizaciones anteriores. Mismo permiso que `MargenBruto` (sección 13); para el resto `0`
  **`MargenActual`** · DECIMAL — **Margen al día** (%) de la cotización, sobre costo, con el **costo actual** del artículo (`HCosto × Equiv`, TC real en `X`/`Y`/`Z`, descuentos de pronto pago). Es el mismo margen de autorización que se ve en pantalla negra (`vtad0100.p`). Se compara contra `MargenBruto` (costo grabado): pueden diferir por ofertas o actualizaciones de costo. **Solo en cotizaciones pendientes por autorizar** (no autorizadas ni canceladas) y para usuarios autorizados a ver margen; en otro caso `0` *(ticket 3561)*

  ### Campos de `ttDetCotDet` (1 registro por partida)

  **`IdCot`** · STRING — Folio de la cotización
  **`Clave`** · STRING — Clave del artículo (`DetCot.Id-Articulo`)
  **`Tipo`** · INT — Tipo de renglón (`DetCot.Tipo`): `1` artículo · `2` sin código · `3`/`4` cortes · `5` comentario
  **`Descr`** · STRING — Descripción de la partida
  **`Cant`** · DECIMAL — Cantidad
  **`IdColor`** · INT — Id del color (`DetCot.Id-Color`); `0` si no tiene color
  **`sColor`** · STRING — Descripción del color (tabla `Kolor`); vacío si no tiene color
  **`IdPres`** · INT — Id de la presentación (`DetCot.Id-Pres`)
  **`Pres`** · STRING — Descripción de la presentación (`ArtPres`); vacío si no se localizó
  **`PUnit`** · DECIMAL — Precio unitario
  **`Descto`** · INT — Porcentaje de descuento de la partida
  **`IndicaPre`** · STRING — Indicador de precio
  **`Importe`** · DECIMAL — Importe de la partida
  **`PorcIVA`** · DECIMAL — Porcentaje de IVA de la partida tal como se grabó (`16` normal; `0` en productos exentos como libros y cuadernos) *(ticket 3439)*
  **`Iva`** · DECIMAL — IVA de la partida (`Importe × PorcIVA / 100`); `0` en renglones sin importe (cortes y comentarios) *(ticket 3439)*
  **`Margen`** · DECIMAL — Margen (%) de la partida, redondeado a 2 decimales. **Puede ser negativo** (ej. `-1.78`) cuando el precio neto queda por debajo del costo. Solo se calcula para usuarios autorizados (ver sección 13); para el resto se retorna `0`
  **`Costo`** · DECIMAL — Costo grabado en la partida (`DetCot.Costo`), por presentación; es el que usan el margen y la autorización. Solo para usuarios autorizados a ver el margen (sección 13); para el resto `0` *(ticket 3550)*
  **`PrecioD1`** · DECIMAL — Precio de referencia del distribuidor D1 para el artículo/presentación/color de la partida. Solo en partidas `Tipo = 1` con `IndicaPre = "*"` (precio especial); el front lo compara contra el precio de la partida para marcar en rojo si queda por debajo. Sin cliente D1 = precio de lista (`Precios.PMay`); en el resto de partidas `0` *(ticket 3562)*
  **`IndicaPreD1`** · STRING — Indicador de precio que da el motor al cliente D1 de referencia (`"D"` = descuento distribuidor); vacío si no hay cliente D1 o la partida no es `"*"` *(ticket 3562)*
  **`IdClienteD1`** · INT — Cliente D1 de referencia usado para el cálculo; `0` = ningún D1 aplica o la partida no es `"*"` *(ticket 3562)*
  **`MargenActual`** · DECIMAL — Margen al día (%) de la partida, sobre costo: `((PUnit × (1 − Descto/100)) / costo actual − 1) × 100`, con el mismo costo actual que `ttCondVenta.MargenActual`. Sirve para ver qué partida bajó contra su `Margen` capturado. Solo partidas `Tipo = 1`, en cotizaciones pendientes y para usuarios autorizados; en otro caso `0` *(ticket 3561)*
  **`TipoArt`** · STRING — Tipo de artículo del catálogo (`A`, `B`, `C`, `N`, `D` = descontinuado, etc.). Sale del **color** de la partida (`ArtCol.Id-TipoArt`) y, si el color no tiene tipo, del **artículo** (`Articulo.Id-TipoArt`). Solo partidas `Tipo = 1`; vacío en renglones sin código, cortes y comentarios (`Tipo` 2–5). No confundir con `Tipo` (tipo de **renglón**) *(ticket 3904)*

  ### Response de error controlado

  ```json
  {
    "IdError": true,
    "Respuesta": "Se requiere la cotizacion.",
    "dsDetalleCot": { "ttClienteDet": [], "ttCondVenta": [], "ttDetCotDet": [] }
  }
  ```

  ---

  ## 9. Validaciones del Servicio

  | Condición | Comportamiento |
  |-----------|----------------|
  | `IdCliente` vacío | `IdError: true` — `"Se requiere el cliente."` |
  | `IdCliente` no numérico o `0` | `IdError: true` — `"Numero de cliente invalido."` |
  | `IdCot` vacío | `IdError: true` — `"Se requiere la cotizacion."` |
  | `IdCot` que no existe | Consulta OK; `ttClienteDet`, `ttCondVenta` y `ttDetCotDet` vacíos (el folio no se valida como numérico) |
  | `iduser` vacío | `IdError: true` — `"Se requiere el usuario (iduser)."` |
  | `iduser` no autorizado a ver margen | Consulta OK; `ttDetCotDet.Margen` = `0` en todas las partidas y `ttCondVenta.MargenBruto` = `0` |
  | `iduser` autorizado | Consulta OK; `ttDetCotDet.Margen` calculado por partida y `ttCondVenta.MargenBruto` (M1) calculado |
  | Cotización pendiente + `iduser` autorizado | Además `MargenActual` (cotización y partida) con el costo del día *(ticket 3561)* |
  | Cotización autorizada o cancelada | `MargenActual` = `0` (cotización y partidas) |
  | Cliente no encontrado | `ttClienteDet` vacío (sin error) |
  | Cotización sin detalle | `ttDetCotDet` vacío (sin error) |
  | Partida con `IndicaPre = "*"` sin cliente D1 | `PrecioD1` = precio de lista (`PMay`), `IdClienteD1` = `0` |
  | Error del motor de precios en el cálculo D1 | Consulta OK; la partida conserva `PrecioD1` = lista y el error queda en el log del agente |
  | Partida `Tipo` 2–5 (sin código, cortes, comentario) | Consulta OK; `TipoArt` = `""` *(ticket 3904)* |
  | Partida con color cuyo `ArtCol` tiene tipo | `TipoArt` = tipo del color (aunque el artículo tenga otro) |
  | Artículo no encontrado en catálogo | Consulta OK; `TipoArt` = `""` |

  ---

