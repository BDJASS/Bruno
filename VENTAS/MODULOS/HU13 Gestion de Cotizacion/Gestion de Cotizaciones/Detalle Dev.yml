  ## 13. Observaciones Técnicas

  1. **Consulta independiente:** el servicio no depende de otros programas REST; busca directamente en `Cliente`, `Cot` y `DetCot`.
  2. **Dataset de 3 tablas:** el orden es `ttClienteDet` (cliente) → `ttCondVenta` (condiciones de venta) → `ttDetCotDet` (partidas).
  3. **`Vencimiento` vs `Vigencia`:** `ttCondVenta.Vencimiento` es la **fecha** de vencimiento; `ttCondVenta.Vigencia` son los **días** de vigencia.
  4. **Campo `Margen` (regla por usuario):** el margen por partida solo se calcula y muestra para los usuarios autorizados. La lista se parametriza en la tabla **`adosa.URL`** con `Parametro = "Cotizacion-Margen-Usuarios"` y `Valor` separado por comas (ej. `"olds,sis10"`). Si la parametrización no existe o viene vacía, se usa el valor por defecto **`"olds"`**. Para cualquier otro usuario el campo `Margen` se retorna en `0`. La validación es por coincidencia exacta de usuario (`CAN-DO`).
  5. **Cálculo del `Margen`:** replica la lógica de la autorización de cotizaciones (`vtaa0069.i`): `margen% = ((precioNeto / (costo × tipoCambio)) − 1) × 100`, donde `precioNeto = PUnit × (1 − Descto/100)`, el costo base es `CostoEsp` si es distinto de `0` o `Costo` en caso contrario, y el tipo de cambio sale de `TipoCambio` para `DetCot.Id-Moneda` (1 si no se localiza). El resultado se redondea a 2 decimales con `ROUND`. **El margen puede ser negativo** (ej. `-1.78`) cuando el precio neto es menor al costo — es un valor válido que se retorna tal cual, sin forzar a cero. Si el costo resulta `0`, el margen se deja en `0` para evitar división por cero.
  6. **Campo `MargenBruto` (M1):** replica el "M1" que muestra el resumen de la autorización de cotizaciones (`vtaa0070.p` / `vtaa0076.i`), calculado sobre **toda la cotización** (solo partidas `Tipo = 1`): `costo = Σ((CostoEsp si > 0, si no Costo) × Cant)`, `subtotal = Σ(Importe)` y `M1% = ((subtotal / costo) − 1) × 100`, redondeado a 2 decimales. A diferencia del margen por partida, **no aplica tipo de cambio** (igual que la pantalla original). Si el costo acumulado es `0` o el resultado es indeterminado, se retorna `0`. Aplica la misma regla de usuarios autorizados del punto 4.
  7. **Orden del detalle (`ttDetCotDet`):** las partidas se retornan en el mismo orden que muestra la autorización de cotizaciones (`vtaa0070.p`): por **secuencia de impresión** (`USE-INDEX idx-sec` = `Id-Cot` + `Id-Seq`).
  8. **Dirección:** se arma concatenando calle, colonia, ciudad, estado y C.P. del cliente.
  9. **Tipo de renglón e IDs de color/presentación (ticket 3392):** cada partida incluye `Tipo` (`DetCot.Tipo`: `1` artículo · `2` sin código · `3`/`4` cortes · `5` comentario) y los identificadores `IdColor` (`DetCot.Id-Color`) e `IdPres` (`DetCot.Id-Pres`), además de las descripciones `sColor` / `Pres` que ya se devolvían. Los IDs se leen directo de `DetCot`, por lo que llegan aunque el renglón no tenga color o sea un comentario.
  10. **Precio de referencia D1 (ticket 3562):** el detalle (PAS) no podía marcar en rojo el precio por debajo del D1, así que se envía `PrecioD1` por partida, con el mismo cálculo que `/Cotizacion/Captura/Partidas` (`cotpartida.p`). Solo se calcula en partidas `Tipo = 1` con `IndicaPre = "*"`.
      - **Cliente de referencia:** se busca dinámico en `DstArt` activo por el artículo y, si no hay, por su grupo (`GGGG00`). Debe ser segmento `D1`, activo y **sin pronto pago** (`DescPP1 = DescPP2 = 0`); entre varios gana el `Id-Cliente` menor. Se resuelve una vez por artículo.
      - **Precio:** se valúa con el motor `obtprecdesc.leePrecios` para ese cliente, usando las condiciones grabadas en `Cot` (`Plazo`, `Id-UbiVta`, `Vigencia`, `PrecioTemp`, `TipoPrecio`), el color y la presentación de la partida, y `PrecCalc = NO`. `PrecioD1` = `Precio2` del motor (`Precio1` si no aplica descuento).
      - **`TipoPrecio` fuera de `M`, `MX`, `TC` o `EX`** (los únicos que acepta el motor): se valúa como `M` (mayoreo).
      - **Degradable:** un error del motor no afecta el resto de la respuesta; queda una línea por artículo en el log del agente (`cotdetalle PrecioD1 art= cteRef= nivel=`).
  11. **Tipo de artículo (ticket 3904):** se agrega `TipoArt` por partida para identificar en "Ver Cotización" los artículos descontinuados a los que se dio descuento por debajo del costo.
      - **Regla:** manda el tipo del **color** (`ArtCol.Id-TipoArt` por artículo + `Id-Color`) y, si no hay, el del **artículo** (`Articulo.Id-TipoArt`). Es la misma regla que usa el alta de cotización para detectar descontinuados: un color puede estar descontinuado (`D`) aunque el artículo no.
      - **Solo `Tipo = 1`:** los cortes (`3`/`4`), igual que los comentarios y los renglones sin código, se graban sin clave de artículo, por lo que no tienen tipo y regresan `""`.
      - **Compatibilidad:** campo nuevo al final de `ttDetCotDet`; los consumidores que no lo lean no se ven afectados.
  12. **Autenticación:** servicio sobre OpenEdge PASOE; si el ambiente requiere Bearer, incluir `Authorization: Bearer <token>`.

  ---
  **Desarrollado por:** SIS10 - JASS
