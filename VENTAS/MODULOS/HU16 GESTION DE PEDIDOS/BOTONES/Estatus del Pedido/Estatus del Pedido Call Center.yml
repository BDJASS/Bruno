docs: |
  # Servicio REST — Seguimiento de Pedido (Estatus)

  ---

  ## 1. Título del Servicio

  **Seguimiento de Pedido**
  Devuelve el renglón de `EstPedido` del pedido-resto solicitado con los nombres ya resueltos (cliente, vendedor, quien recibió, surtidores de área C y D, empacador, surtidor y empacador de cortes, transporte y chofer), la descripción del estatus, los tiempos de pausa, las horas formateadas y el porcentaje de avance de surtido.
  Programa servidor: `estpedido_p.p` · Procedimiento: `leeEstpedido` | Tabla principal: `EstPedido`
  Include del temp-table: `estpedido.i` (`ttEstPedido` / `dsEstPedido`)

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Ventas/Pedidos/Seguimiento
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`IdPedido`** · STRING · ✅ — Número de pedido (`EstPedido.Id-Pedido`, `X(7)`)
  - Ej: `"334433"` · Se compara con `TRIM()`, sin relleno de ceros

  **`Resto`** · STRING · ❌ — Resto del pedido (`EstPedido.Id-Seq`)
  - Ej: `"0"` · Vacío o no enviado = **`0`**, el resto original *(default)*

  **`IdUser`** · STRING · ✅ — Usuario que consulta
  - Ej: `"olds"`

  > **Nota sobre el nombre del resto.** En la tabla `Pedido` el campo se llama `Resto`; en `EstPedido` se llama `Id-Seq`. Son el mismo dato. El parámetro se llama `Resto` porque es el nombre que ve el usuario en pantalla.

  ---

  ## 5. Body

  No aplica. Método `GET`.

  ---

  ## 6. Headers

  | Header         | Valor                                  |
  |----------------|----------------------------------------|
  | `Accept`       | `application/json`                     |
  | `Content-Type` | `application/json` *(opcional en GET)* |

  ---

  ## 7. Ejemplo de Request

  ```
  GET http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Ventas/Pedidos/Seguimiento?IdPedido=334433&Resto=0&IdUser=olds
  ```

  ---

  ## 8. Ejemplo de Response

  `ttEstPedido` devuelve **0 o 1 registro**: el índice `idx-sur` de `EstPedido` es `UNIQUE` por (`Id-Pedido`, `Id-Seq`).

  El JSON trae **muchos campos** — el temp-table arrastra por `BUFFER-COPY` todos los campos de `EstPedido` y además los alias sin guion. El ejemplo muestra los de uso real; el detalle completo va en 8.1 a 8.9.

  ```json
