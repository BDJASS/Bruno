docs: |
  # Servicio REST — Pedidos: Consulta de Costo

  ---

  ## 1. Título del Servicio

  **Pedidos — Consulta de Costo**
  Regresa **solo la información inicial** de los renglones de un artículo en un pedido (lo que se ve al enviar pedido+resto+artículo), con su costo actual, para la pantalla de captura de costos.
  Programa servidor: `pedcosto.p` · Procedimiento: `consultaCosto` (GET) | Versión REST de `vtad0275.p` (modo carácter). Módulo `/Ventas/Pedidos/`.

  > La modificación del costo se hace con `POST /Ventas/Pedidos/ActualizaCosto` (ver `pedcosto-ActualizaCosto.md`).

  ---

  ## 2. Método HTTP y URL

  ```
  GET http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Ventas/Pedidos/Costo
  ```

  ---

  ## 3. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`IdPedido`** · STRING · ✅ — Folio del pedido (se normaliza)
  **`Resto`** · STRING · ❌ — Resto; vacío = `0`
  **`IdArticulo`** · STRING · ✅ — Clave del artículo (se rellena a 6 dígitos)
  **`IdUser`** · STRING · ✅ — Usuario (la regla de pedido facturado depende del usuario, por eso se pide también en la consulta)

  ---

  ## 4. Ejemplo de Request

  ```
  GET .../Ventas/Pedidos/Costo?IdPedido=2955590&Resto=0&IdArticulo=066406&IdUser=olds
  ```

  ---

  ## 5. Campos del Response (`ttCosto`, por renglón)

  **`Reng`** · INTEGER — Número de renglón
  **`CantPed`** · DECIMAL — Cantidad pedida
  **`Color`** · STRING — Color (descripción)
  **`Presentacion`** · STRING — Presentación
  **`Costo`** · DECIMAL — Costo actual del renglón
  **`YaFacturado`** · BOOLEAN — `true` si el pedido ya está facturado (estatus ≥ 5, o -2 con factura); el front muestra la advertencia antes de capturar

  > **No** incluye la `Variacion en costo`: ese label solo se calcula al modificar el costo y se regresa como **salida del POST** `ActualizaCosto`.

  **`Respuesta`** — en éxito no cuenta renglones; solo confirma el contexto (`"Articulo <art> en pedido <folio>-<resto>."`, con el aviso de facturado antepuesto si aplica). En error trae el motivo.

  ---

  ## 6. Validaciones (mensajes exactos)

  | Caso | Comportamiento |
  |------|----------------|
  | Pedido inexistente | `"PEDIDO INEXISTENTE"` |
  | Facturado y usuario NO en OLDS/ALEX/FRANC | `"PEDIDO YA FACTURADO, IMPOSIBLE CAMBIAR PRECIOS"` |
  | Facturado y usuario autorizado | **Aviso** (no bloquea): `"EL PEDIDO YA ESTA FACTURADO, EL CAMBIO DE COSTO SE AFECTARA A SU FACTURA TAMBIEN."` |
  | Artículo no está en el pedido | `"ARTICULO INEXISTENTE EN EL PEDIDO"` |

  ---

  ## 7. Plan de Pruebas

  | # | Caso | Esperado |
  |---|------|----------|
  | C1 | GET a pedido inexistente | `"PEDIDO INEXISTENTE"` |
  | C2 | GET a pedido facturado con usuario normal | `"PEDIDO YA FACTURADO..."` |
  | C3 | GET a pedido facturado con usuario `ALEX` | `ttCosto` + aviso de facturado antepuesto; `YaFacturado=true` |
  | C4 | GET artículo ajeno al pedido | `"ARTICULO INEXISTENTE EN EL PEDIDO"` |
  | C5 | GET válido | `ttCosto` con los renglones del artículo y su costo actual |

  ---

  ## 8. Resultado

  | Estado              | Descripción                                                  |
  |---------------------|--------------------------------------------------------------|
  | ⏳ Pendiente prueba | Servicio desarrollado. Pendiente de compilación/deploy y QA. |

  ---
