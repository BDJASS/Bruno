docs: |
  # Servicio REST — Pedidos: Requisiciones Ligadas a un Pedido

  ---

  ## 1. Título del Servicio

  **Requisición de Traspaso — Requisiciones por Pedido**
  Devuelve los folios de `ReqAlm` ligados a un pedido + resto, con origen, destino, fecha, estatus y número de partidas. Es la consulta **previa**: el front la usa para listar y que el usuario elija un folio, y con ese folio abre el detalle con `GET .../Requisicion/Consulta`.
  Programa servidor: `reqalm.p` · Procedimiento: `requisicionesPorPedido`. Módulo `/Ventas/Pedidos/`.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Ventas/Pedidos/Requisicion/PorPedido
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`IdPedido`** · STRING · ✅ — Folio del pedido. Se convierte a mayúsculas
  **`Resto`** · INTEGER · ❌ — Resto del pedido. Vacío = `0`

  ---

  ## 5. Body

  No aplica.

  ---

  ## 6. Headers

  ```
  Content-Type: application/json
  ```

  ---

  ## 7. Ejemplo de Request

  ```
  GET .../Ventas/Pedidos/Requisicion/PorPedido?IdPedido=2956181&Resto=0
  ```

  ---

  ## 8. Ejemplo de Response

  ### Con requisiciones ligadas

  ```json
  {
    "response": {
      "IdError": false,
      "Respuesta": "Se encontraron 2 requisicion(es) ligadas al pedido.",
      "ttReqPedido": [
        {
          "IdReq": "R000123", "Resto": 0, "FecReg": "2026-07-20",
          "IdEstatus": 2, "Estatus": "FIN DE SURTIDO",
          "IdUbic": "MLO", "DescOrigen": "MATRIZ LOCAL",
          "IdDest": "02B", "DescDest": "CEDIS",
          "IdSolic": "JPG", "NomSolic": "JUAN PEREZ GARCIA",
          "Coment1": "Reposicion semanal",
          "Autorizada": true, "Cancelada": false, "NumPartidas": 7
        },
        {
          "IdReq": "R000148", "Resto": 0, "FecReg": "2026-07-24",
          "IdEstatus": 0, "Estatus": "ORIGINAL",
          "IdUbic": "MLO", "DescOrigen": "MATRIZ LOCAL",
          "IdDest": "03A", "DescDest": "ALMACEN 3A",
          "IdSolic": "JPG", "NomSolic": "JUAN PEREZ GARCIA",
          "Coment1": "",
          "Autorizada": true, "Cancelada": false, "NumPartidas": 2
        }
      ]
    }
  }
  ```

  ### Sin requisiciones ligadas

  ```json
  {
    "response": {
      "IdError": false,
      "Respuesta": "El pedido no tiene requisiciones ligadas.",
      "ttReqPedido": []
    }
  }
  ```

  ---

  ## 9. Campos de response (`ttReqPedido`)

  **`IdReq`** · STRING — Folio de la requisición. Es el valor que se manda a `GET .../Requisicion/Consulta`
  **`Resto`** · INTEGER — Resto de la requisición
  **`FecReg`** · DATE — Fecha de registro
  **`IdEstatus`** · INTEGER — Estatus numérico de `EstPedido.Estatus`. `0` si la requisición no tiene `EstPedido`
  **`Estatus`** · STRING — Estatus en texto: el label **ESTATUS** de la pantalla de consulta del carácter (`bodb0150.p:67-79`). Vacío si no hay `EstPedido`
  - `-2` PAUSA EMBARQUE · `-1` PAUSA SURTIDO · `0` ORIGINAL · `1` INICIO DE SURTIDO
  - `2` FIN DE SURTIDO · `3` INICIO DE EMPAQUE · `4` FIN DE EMPAQUE
  - `5` SALIDA POR TRASPASO · `6` EMBARCADO · otro = ENTRADA POR TRASPASO

  **`IdUbic`** · STRING — Almacén origen (el que solicita)
  **`DescOrigen`** · STRING — Descripción del almacén origen (`Almacen.Refer`)
  **`IdDest`** · STRING — Almacén destino (el que surte)
  **`DescDest`** · STRING — Descripción del almacén destino
  **`IdSolic`** · STRING — Clave del solicitante
  **`NomSolic`** · STRING — Nombre del solicitante (`PersAlm.Nombre`)
  **`Coment1`** · STRING — Comentario de la requisición
  **`Autorizada`** · BOOLEAN — `true` = tiene folio real y ya comprometió inventario
  **`Cancelada`** · BOOLEAN — `true` = requisición cancelada
  **`NumPartidas`** · INTEGER — Cuántos renglones tiene en `DetReq`

  Ordenado por fecha de registro y folio.

  ---

  ## 10. Validaciones del Servicio

  **`"Se requiere el pedido."`** — `IdPedido` vacío o nulo. Es el único caso que devuelve `IdError = true`

  **No se valida que el pedido exista.** Es deliberado: un pedido cancelado se **elimina** de la tabla `Pedido` (lo hace `pedsolcanc.p` en la cancelación inmediata), pero sus requisiciones siguen vivas — y ése es justamente uno de los casos en que se quiere consultarlas. Un pedido inexistente simplemente devuelve la lista vacía con `IdError = false`.

  ---

  ## 11. Flujo de uso

  ```
  GET  .../Requisicion/PorPedido?IdPedido=2956181&Resto=0
          ↓ el usuario elige un folio de la lista
  GET  .../Requisicion/Consulta?IdReq=R000123&Resto=0
  ```

  ---
  **Desarrollado por:** SIS10 - JASS
