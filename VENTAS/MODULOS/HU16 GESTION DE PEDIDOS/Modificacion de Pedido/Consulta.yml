  ### Pedido inexistente

  ```json
  { "response": { "IdError": true, "Respuesta": "Pedido inexistente, verifique..." } }
  ```

  ### Pedido ya facturado (avisa, no bloquea)

  ```json
  {
    "response": {
      "IdError": false,
      "Respuesta": "El pedido ya fue facturado, verifique que los cambios realizados no afecten al mismo pedido.",
      "ttPedido": [ ... ], "ttComentario": [ ... ]
    }
  }
  ```

  ---

  ## 9. Campos de la respuesta `ttPedido`

  **Generales**
  **`IdPedido`** · STRING — Folio del pedido
  **`Resto`** · INTEGER — Resto del pedido
  **`FecReg`** · DATE — Fecha de registro (solo lectura)
  **`MetodoPPD`** · BOOLEAN — `true` = PPD; `false` = PUE. Viaja como booleano, no `"SI"/"NO"`
  **`IdVendedor`** · STRING — Folio del vendedor (4 dígitos)
  **`NombreVendedor`** · STRING — Nombre del empleado del vendedor (solo lectura)
  **`IdForPed`** · STRING — Folio de agente / forma de pedido
  **`IdCliente`** · INTEGER — Número de cliente (`3` = cliente sin registro)
  **`RazonSocial`** · STRING — Razón social
  **`RFC`** · STRING — RFC (sin espacios)
  **`NomEmpresa`** · STRING — Nombre de empresa
  **`RSocietario`** · STRING — Régimen societario
  **`CalleNo`** · STRING — Calle y número fiscal
  **`Colonia`** · STRING — Colonia fiscal
  **`IdCiudad`** · INTEGER — Folio de ciudad fiscal
  **`NombreCiudad`** · STRING — Nombre de la ciudad (solo lectura)
  **`NombreEstado`** · STRING — Nombre del estado (solo lectura)
  **`CP`** · STRING — Código postal fiscal

  **Envío / embarque**
  **`RazonSocial1`** · STRING — Embarcar a
  **`Email`** · STRING — Correo del pedido
  **`CalleNo1`** · STRING — Calle de embarque
  **`Colonia1`** · STRING — Colonia de embarque
  **`Ciudad1`** · STRING — Ciudad de embarque (texto)
  **`Estado1`** · STRING — Estado de embarque (texto)
  **`CP1`** · STRING — CP de embarque
  **`Referencia`** · STRING — Referencia de entrega
  **`Attn`** · STRING — Contacto
  **`IdEntrega`** · INTEGER — Folio de tipo de entrega
  **`DescrEntrega`** · STRING — Descripción de la entrega (solo lectura)
  **`IdTran`** · INTEGER — Folio de transporte (`0` si entrega ≤ 11 o 16)
  **`NombreTran`** · STRING — Nombre del transporte (solo lectura)

  **Banderas / condiciones**
  **`Vigentes`** · BOOLEAN — Precios vigentes
  **`EnTarima`** · BOOLEAN — Tipo de empaque en tarima
  **`Adelantado`** · BOOLEAN — Facturar por adelantado
  **`SurtParcial`** · BOOLEAN — Surtido parcial
  **`BckOrd`** · INTEGER — Tipo de backorder
  **`Seguro`** · BOOLEAN — Seguro
  **`DescPP1`** · DECIMAL — % de descuento pronto pago
  **`ReqCte`** · STRING — Requisición del cliente
  **`Notas1`** · STRING — Observación 1
  **`Notas2`** · STRING — Observación 2
  **`PagAnt`** · BOOLEAN — Pago anticipado (editable solo en contado)
  **`SolCancPed`** · BOOLEAN — Solicitud de cancelación

  **Fiscales (CFDI)**
  **`FEFormaPago`** · STRING — Forma de pago SAT (editable solo en contado)
  **`FEDigitosCuenta`** · STRING — Dígitos de cuenta (editable solo en contado)
  **`IdRFiscal`** · STRING — Régimen fiscal
  **`IdUsoCFDI`** · STRING — Uso de CFDI
  **`IdRemision`** · STRING — Envío con remisión (`S`/`N`)

  **Solo lectura (contexto, no editables)**
  **`IdCond`** · INTEGER — Condición de venta (se cambia con **CondicionVenta**)
  **`Plazo`** · INTEGER — Plazo (se cambia con **CondicionVenta**)
  **`IdEstatus`** · INTEGER — Estatus del pedido
  **`IdFactura`** · STRING — Folio de factura si ya facturó
  **`IdLiga`** · STRING — Liga del pedido
  **`PausaReja`** · BOOLEAN — Pausado en reja
  **`Importe`** · DECIMAL — Total del pedido (`Pedido.Tot`)

  ---

  ## 10. Campos de la respuesta `ttComentario`

  Renglones de comentarios/cortes del detalle (`DetPedido.Tipo > 1`):

  **`IdPedido`** · STRING — Folio del pedido
  **`Resto`** · INTEGER — Resto
  **`Reng`** · INTEGER — Renglón del detalle
  **`Tipo`** · INTEGER — Tipo de renglón (`> 1`)
  **`Descr`** · STRING — Texto del comentario (editable con **ComentariosDetalle**)

  ---

  ## 11. Reglas y Notas

  1. **Normalización de folio:** el `IdPedido` se pasa por `NormalizaFolio` (prefijo de 1 letra + 6 dígitos con ceros), igual que la captura.
  2. **Descripciones de catálogos** (`NombreVendedor`, `NombreCiudad`, `NombreEstado`, `DescrEntrega`, `NombreTran`) se resuelven en el GET para que el front las muestre sin llamadas extra. Son **solo lectura**; no se reenvían para guardar.
  3. **Aviso de facturado:** si `Id-Estatus > 4` o `< -1` con factura, el `Respuesta` trae el aviso pero **`IdError = false`** — la pantalla tampoco bloquea, solo advierte.
  4. **`MetodoPPD` es booleano** (`true`/`false`), no `"SI"/"NO"` ni `"1"/"0"`. Al reenviar a ActualizaGenerales hay que mandarlo con el valor que devolvió este GET (ver la nota del contrato en [pedcambio-ActualizaGenerales.md](pedcambio-ActualizaGenerales.md)).
  5. Este GET **no** valida `IdUser` (es solo lectura); el usuario se exige en el POST.

  ---

  ## 12. Registro en el resourceModel

  Recurso `_Ventas_Pedidos_Consulta`, path `/Ventas/Pedidos/Consulta`, verbo **GET**, operación `pedcambio..leePedido`. El binding ya existe en `pedcambio.pidl`.

  ---

  ## 13. Plan de Pruebas

  | # | Caso | Esperado |
  |---|------|----------|
  | P1 | Pedido válido | `ttPedido` completo + `ttComentario`; comparar contra la pantalla |
  | P2 | Pedido inexistente | `"Pedido inexistente, verifique..."` |
  | P3 | Pedido facturado | Devuelve datos + aviso, `IdError = false` |
  | P4 | Folio sin ceros (`P2965291` vs `2965291`) | Normaliza y encuentra el mismo pedido |
  | P5 | `Resto` vacío | Toma `0` |

