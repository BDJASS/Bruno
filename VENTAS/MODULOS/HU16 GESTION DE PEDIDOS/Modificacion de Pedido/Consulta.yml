docs: |
  # Servicio REST — Pedidos: Consulta para Edición

  ---

  ## 1. Título del Servicio

  **Pedidos — Consulta de Pedido para Edición**
  Regresa el pedido completo (generales, fiscales, envío, banderas) más los renglones de comentarios (`Tipo > 1`), listo para que el front lo edite y lo reenvíe a **ActualizaGenerales**. Es la carga inicial de la vista **Generales** del editor de pedidos.
  Programa servidor: `pedcambio.p` · Procedimiento: `leePedido` | Versión REST de `vtab0130.p` (modo carácter, `PROCEDURE Generales`). Módulo `/Ventas/Pedidos/`.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Ventas/Pedidos/Consulta
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`IdPedido`** · STRING · ✅ — Folio del pedido. Se normaliza a 7 posiciones (prefijo + 6 dígitos con ceros)
  **`Resto`** · STRING · ❌ — Resto del pedido. Vacío o no numérico = `0`

  ---

  ## 5. Body

  No aplica.

  ---

  ## 6. Headers

  ```
  Content-Type: application/json
  ```

  ---

  ## 7. Ejemplo de Request

  ```
  GET .../Ventas/Pedidos/Consulta?IdPedido=2965291&Resto=0
  ```

  ---

