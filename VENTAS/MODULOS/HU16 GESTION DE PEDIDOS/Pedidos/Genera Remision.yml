  ## 12. Plan de Pruebas

  | # | Caso | Esperado |
  |---|------|----------|
  | P1 | Sin `IdUser` | `"Se requiere el usuario (IdUser)."` |
  | P2 | Pedido de contado normal | `Remision`/`DetRemis` creadas; `IdRemision` con folio; timbrada |
  | P3 | Comparar contra carácter | `Remision.Tot`, `DetRemis`, `ArtUbic` iguales |
  | P4 | Pedido bajo mínimo (mayoreo) | `[RequiereAjuste:II] ...` → reenviar con `Ajuste=II` |
  | P5 | Pedido pagado con depósito conciliado | `Pagada=TRUE` + `MovCaja`/`DetMovC` generados |
  | P6 | Remisión "II" | `Tot` sin doble IVA (subtotal neto de IVA) |
  | P7 | Pedido de crédito (`Id-Cond>0`) | `"ESTE PEDIDO TIENE CONDICIONES DE CREDITO..."` |
  | P20 | Pedido marcado por adelantado, sin empacar | Se remisiona por lo pedido; sin movimiento de inventario |
  | P21 | Pedido sin empacar, no marcado, sin entregas, sin `Confirmado` | `IdError=true`, `RequiereConfirmacion=true`, nada se crea |
  | P22 | El mismo pedido con `Confirmado=true` | Se remisiona por adelantado y el pedido queda marcado |
  | P23 | Pedido sin empacar con partidas ya entregadas | Se detiene con mensaje; `RequiereConfirmacion=false` |
  | P24 | Pedido empacado normal | Igual que antes |

