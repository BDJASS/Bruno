docs: |
  # Servicio REST — Facturación Crédito: GET Completo

  ---

  ## 1. Título del Servicio

  **Facturación Crédito — Datos Completos de la Factura**
  Es la consulta que abre el botón **Crédito** (pantalla *"FACTURACION CREDITO / Datos Generales"* de `vtaa0499.p`, con sus pestañas **Generales / Embarque / Memo / Detalle**). En **una sola llamada** devuelve todo lo necesario para armar la factura: encabezado (datos del pedido→factura + info de crédito del cliente + serie/folio tentativo + totales) y renglones. **Reemplaza la pareja anterior `datosGeneralesCredito` + `simulaFactura`.**
  **Solo lectura:** no crea ni edita nada. El front muestra los datos, deja que el usuario **edite** los campos editables (Embarque / Memo / Requisición) y **regresa el mismo dataset** al POST [GeneraFactura](pedfactura-GeneraFactura.md).
  Programa servidor: `pedfactura.p` · Procedimiento: `datosGeneralesCredito`. Módulo `/Ventas/Pedidos/`.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Pedido/datosGeneralesCredito
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`IdUser`** · STRING · ✅ — Usuario. Vacío → *"Se requiere el usuario (IdUser)."*
  **`IdPedido`** · STRING · ✅ — Folio del pedido (se normaliza)
  **`Resto`** · STRING · ❌ — Resto; vacío = `0`
  > **El origen ya NO se recibe:** se **deriva del usuario** (`Usuario.Id-Ubicacion` donde `Usuario.Id-User = IdUser`). Determina la **serie del folio** (02B→`FACCEDIS`, FUG→`FACFUG`, otro→`FAC`). Usuario inexistente / sin ubicación → error.
  **`IvaGlobal`** · DECIMAL · ❌ — IVA global de la empresa para comparar contra la zona del cliente (default `16`)

  ---

  ## 5. Body

  No aplica (todo por query string).

  ---

  ## 6. Headers

  ```
  Content-Type: application/json
  ```

  ---

  ## 7. Ejemplo de Request

  ```
  GET .../Pedido/datosGeneralesCredito?IdUser=olds&IdPedido=2965291&Resto=0
  ```

  ---

