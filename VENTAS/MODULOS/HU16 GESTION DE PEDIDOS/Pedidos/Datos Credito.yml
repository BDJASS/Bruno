  ---

  ## 9. Campos de respuesta

  ### `ttFacturaGral` — encabezado (1 fila)

  #### 🔒 CONSULTA (solo lectura — el front NO los edita)
  **`IdPedido`** · STRING · **`Resto`** · INT · **`FecReg`** · DATE
  **`IdVendedor`** · STRING · **`NombreVendedor`** · STRING · **`Ubicacion`** · STRING
  **`IdCliente`** · INT · **`RazonSocial`** · STRING · **`Propietario`** · STRING
  **`CalleNo`** · **`Colonia`** · **`Poblacion`** · **`Estado`** · STRING — domicilio **fiscal**
  **`RFC`** · **`Tel`** · **`Fax`** · STRING · **`Cotizacion`** · STRING · **`TipoPrecio`** · STRING
  **`IdCond`** · INT · **`Condicion`** · STRING · **`Bultos`** · **`Tarimas`** · INT
  **`IdEntrega`** · INT · **`Entrega`** · STRING · **`ImpFlete`** · DEC · **`Notas1`** · **`Notas2`** · STRING (notas del pedido)
  **`EsCredito`** · BOOL (`true`) · **`TipoFactura`** · STRING (`CREDITO`) · **`IdRFiscal`** · **`IdUsoCFDI`** · STRING · **`IdTran`** · INT
  **`Plazo`** · INT · **`FecVence`** · DATE · **`SerieFolio`** · STRING · **`FolioTentativo`** · STRING (espiado, no consumido)
  **`IvaZona`** · DEC · **`EsFrontera`** · BOOL · **`SubTotal`** · **`IVA`** · **`Total`** · DEC
  **`NotasCargo`** · INT · **`DiasVencido`** · INT · **`CreditoDisp`** · DEC · **`SaldoVencido`** · DEC · **`ChequesDev`** · INT · **`LimiteCredito`** · DEC — info de crédito (`vtaa0137.i`)

  #### ✏️ EDITABLE (el front los edita y los regresa a `generaFactura`)
  **`Requisicion`** · STRING — pestaña Generales (`Pedido.ReqCte`)
  **`RazonSocial1`** · **`CalleNo1`** · **`Colonia1`** · STRING — pestaña **Embarque** (domicilio de envío)
  **`IdCiudad1`** · INT (clave de ciudad; al facturar deriva `Ciudad1`/`Estado1`) · **`Ciudad1`** · **`Estado1`** · STRING (nombres, informativos)
  **`Delegacion1`** · **`CP1`** · STRING · **`IdRutaEmb`** · INT (solo aplica si `IdTran = 0`) · **`RutaEmb`** · STRING (descr, informativo)
  **`Tel1`** · **`Fax1`** · **`Email`** · **`Attn1`** · STRING
  **`Observaciones1`** · **`Observaciones2`** · STRING — pestaña **Memo**

  ### `ttFacturaDet` — renglones (🔒 CONSULTA)
  **`Reng`** · INT · **`IdArticulo`** · STRING · **`Descr`** · STRING · **`IdColor`** · **`IdPres`** · INT · **`Tipo`** · INT
  **`Cant`** · DEC · **`PrecUnit`** · DEC · **`Descto`** · INT (%) · **`Importe`** · DEC · **`PorcIVA`** · DEC · **`IVA`** · DEC · **`IdAlm`** · STRING

  > Los renglones **no se editan**; se calculan de `DetPedido` (Cant = CantEnt si > 0, si no CantPed; Importe = Cant × PrecUnit × (1−Descto/100)). Al facturar, `generaFactura` los **re-lee** de la BD (no confía en lo que mande el front).

  ---

  ## 10. Reglas y comportamiento

  1. **Un solo GET completo.** Devuelve encabezado + renglones + totales + serie/folio tentativo. Ya **no** existe `simulaFactura`.
  2. **Solo consulta.** No crea `Factura`, no consume folio, no toca inventario/CxC.
  3. **Editable vs consulta:** ver §9. Al facturar, el front **regresa `dsFactura` completo** al POST; `generaFactura` toma de `ttFacturaGral` **solo** los campos editables y re-lee `DetPedido` para los renglones.
  4. **Crédito vs Contado (motor `vtaa0499.p` L362-372):** si `Id-Cond = 0` (contado) → **bloquea**. El espejo en contado bloquea los de crédito y la frontera.
  5. **Frontera:** si `Zona.Porc-IVA` ≠ `IvaGlobal` (y entrega ≠ 11/16) → `EsFrontera = true`, serie `FACFRON`; el IVA definitivo se recalcula al facturar.

  ---

  ## 11. Registro en el resourceModel

  Recurso a dar de alta (aún **no registrado**): path `/Pedido/datosGeneralesCredito`, verbo **GET**, operación `pedfactura..datosGeneralesCredito`, params `IdPedido`, `Resto`, `IvaGlobal`, `IdUser` (**sin `Origen`** — se deriva del usuario); **respuesta = dataset `dsFactura`**. Regenerar `pedfactura.pidl` en PDSOE.

  ---

  ## 12. Plan de Pruebas

  | # | Caso | Esperado |
  |---|------|----------|
  | P1 | Sin `IdUser` | `"Se requiere el usuario (IdUser)."` |
  | P2 | Pedido de crédito válido | `ttFacturaGral` (1 fila) + `ttFacturaDet` (N) + totales; `EsCredito=true` |
  | P3 | Comparar totales vs pedido carácter | `SubTotal`/`IVA`/`Total` coinciden |
  | P4 | Info de crédito vs `vtaa0499` | `CreditoDisp`/`DiasVencido`/`SaldoVencido`/`NotasCargo`/`ChequesDev` coinciden |
  | P5 | Pedido de contado (`Id-Cond=0`) | Bloqueo *"...CONDICION DE CONTADO..."* |
  | P6 | Ya facturado / cancelación / GRAFICO / RFC<12 | Bloqueo con su mensaje |

