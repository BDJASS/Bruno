docs: |
  # Servicio REST — Facturación: Genera Factura

  ---

  ## 1. Título del Servicio

  **Facturación — Generación de la Factura**
  **Genera** la factura de un pedido: consume el folio real, crea `Factura`/`DetFactura`, afecta inventario y cuentas por cobrar (CxC), descompromete y marca el pedido facturado. Port del motor carácter `vtaa0499.p` (crédito) a REST, no interactivo, en **una sola transacción**. **No timbra** (el CFDI es un paso aparte, ver [TimbraFactura](pedfactura-TimbraFactura.md)).
  Programa servidor: `pedfactura.p` · Procedimiento: `generaFactura`. Módulo `/Ventas/Pedidos/`.

  > ⚠️ **Proceso crítico (dinero, folios fiscales, inventario, CxC).** Requiere compilar en PDSOE y **QA contra una factura de carácter** antes de producción (ver §11).

  ---

  ## 2. Método HTTP

  ```
  POST
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Pedido/generaFactura
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`IdUser`** · STRING · ✅ — Usuario que factura. Vacío → *"Se requiere el usuario (IdUser)."*
  **`IdPedido`** · STRING · ✅ — Folio del pedido (se normaliza)
  **`Resto`** · STRING · ❌ — Resto; vacío = `0`
  **`Origen`** · STRING · ❌ — Almacén de origen (determina la serie del folio y el almacén de la factura)
  **`IvaGlobal`** · DECIMAL · ❌ — IVA global para comparar contra la zona (default `16`)

  ---

  ## 5. Body

  No aplica (todo por query string).

  ---

  ## 6. Headers

  ```
  Content-Type: application/json
  ```

  ---

  ## 7. Ejemplo de Request

  ```
  POST .../Pedido/generaFactura?IdUser=olds&IdPedido=2965291&Resto=0&Origen=02B
  ```

  ---

  ## 8. Ejemplo de Response

  ### Éxito

  ```json
  {
    "response": {
      "IdError": false,
      "Respuesta": "Factura FACCEDIS0012345 generada para el pedido 2965291-0. Pendiente de timbrado CFDI.",
      "IdFactura": "0012345"
    }
  }
  ```

  ### Error

  ```json
  { "response": { "IdError": true, "Respuesta": "PEDIDO YA FACTURADO, FOLIO: F0012345", "IdFactura": "" } }
  { "response": { "IdError": true, "Respuesta": "No se encontro el consecutivo de folio para la serie FACCEDIS (almacen ''). Verifique el catalogo de folios.", "IdFactura": "" } }
  ```

  ---

  ## 9. Campos de respuesta

  **`IdError`** · BOOLEAN — `true` si no se pudo generar (nada se guarda; la transacción se deshace)
  **`Respuesta`** · STRING — mensaje al usuario
  **`IdFactura`** · STRING — folio de la factura generada (vacío si hubo error)

  ---

  ## 10. Qué hace (una transacción; réplica de `PROCEDURE Actualiza` de `vtaa0499.p`)

  1. **Bloqueos** (igual que `validaPedidoFacturable`): ya facturado, solicitud de cancelación, `*** GRAFICO`, RFC < 12.
  2. **Folio real:** serie `FAC`/`FACCEDIS`(02B)/`FACFUG`(FUG)/`FACFRON`(frontera); consecutivo de `Folio` (o `VFolio` si origen ≠ 02B/FUG) con `EXCLUSIVE-LOCK` e incremento.
  3. **`CREATE Factura`** — datos fiscales/envío del pedido (con fallback a `Cliente`), `VersionSAT = "4.0"`, `Id-Captura = IdUser`.
  4. **`DetFactura`** por cada `DetPedido` (Tipo<3): `Cant`, `Importe`, `PorcIVA` forzado por serie (11/16), `Iva`, y **costo** (`HCosto × ArtPres.Equiv`, más costo especial de contrato vía `CostoEspecial`).
  5. **Inventario** (`{vtaa0004.i}`) para renglones no entregados; los empacados se liberan con los subprogramas.
  6. **Totales** de la factura (`SubTotal`, `IVA`, `Tot`).
  7. **Subprogramas del motor:** `vtaa0508.p` (descompromete) · `embd0020.p` (marca facturado: `Id-Estatus = 5`, `Id-Factura`) · `vtaa0524.p` (recalcula IVA) · `vtaa0494.p` (descompromete no surtido).
  8. **CxC** (`{cxca0001.i}`): cargo a `MovCliente` con `Saldo = Factura.Tot`.
  9. **COMMIT** + auditoría (`programas/auditoria.p`, módulo Pedidos).

  **Decisiones aplicadas:** sin validación de límite de crédito (igual que el motor); una sola transacción, folio real directo (sin `TMPFAC`); no timbra CFDI (paso aparte).

  ---

  ## 11. Notas técnicas / QA (antes de producción)

  1. **Compilar en PDSOE** y confirmar que los includes **`vtaa0004.i`** y **`cxca0001.i`** estén en el PROPATH del AppServer (si no, agregarlos o inlinear su lógica).
  2. **Probar en DEV con un pedido de prueba** y comparar `Factura` / `DetFactura` / `MovCliente` (CxC) / `ArtUbic` (inventario) **contra el proceso carácter**, campo por campo.
  3. Confirmar el 3er parámetro de la serie/tasa según el tipo (el motor de crédito pasa `3`).
  4. **Registrar** el recurso en `resourceModel.xml` (path `/Pedido/generaFactura`, **POST**, operación `pedfactura..generaFactura`) y regenerar `pedfactura.pidl`.

  ---

  ## 12. Plan de Pruebas

  | # | Caso | Esperado |
  |---|------|----------|
  | P1 | Sin `IdUser` | `"Se requiere el usuario (IdUser)."` |
  | P2 | Pedido facturable | `Factura`/`DetFactura` creadas; `IdFactura` con folio; pedido a estatus 5 |
  | P3 | Comparar contra carácter | `Factura.Tot`, `DetFactura`, `MovCliente`, `ArtUbic` iguales |
  | P4 | Pedido ya facturado | `"PEDIDO YA FACTURADO..."`, nada se crea |
  | P5 | Serie sin consecutivo de folio | Mensaje de folio, transacción deshecha |
  | P6 | Reintento del mismo pedido | Bloqueado (ya tiene `Id-Factura`) |

  ---
