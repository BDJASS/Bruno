docs: |
  # Servicio REST — Pedidos: Consulta del Detalle (renglones)

  ---

  ## 1. Título del Servicio

  **Pedidos — Detalle del Pedido**
  Regresa los renglones (`DetPedido`) de un pedido: artículo, color, presentación, cantidades (pedida/surtida/entregada/reservada/backorder), precio, IVA, importe y estatus del artículo. Es el detalle que acompaña a la [consulta de pedidos](pedido2-ConsultaPedidos.md).
  Programa servidor: `detpedido.p` · Procedimiento: `leeDetPedido`. Módulo `/Ventas/Pedidos/`.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL (ruta de la operación)

  ```
  .../detpedido/leeDetPedido
  ```

  Servicio por anotación (`@progress.service.resource URI="/detpedido"` + `resourceMapping URI="/leeDetPedido"`). El prefijo host/webapp depende del despliegue (p. ej. `http://192.0.1.14:8853/RestADOSAVentas/rest/detpedido/leeDetPedido`).

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`IdUser`** · STRING · ✅ — Usuario que consulta. Vacío → *"Se requiere el usuario (IdUser)."*
  **`Id-Pedido`** · STRING · ✅ — Folio del pedido. Debe ser numérico/≠ 0
  **`Resto`** · STRING · ❌ — Resto del pedido. Vacío = todos los restos del folio

  ---

  ## 5. Body

  No aplica.

  ---

  ## 6. Headers

  ```
  Content-Type: application/json
  ```

  ---

  ## 7. Ejemplo de Request

  ```
  GET .../detpedido/leeDetPedido?IdUser=olds&Id-Pedido=2965291&Resto=0
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "response": {
      "IdError": false,
      "Respuesta": "Consulta ejecutada correctamente.",
      "ttDetPedidoLee": [
        {
          "IdPedido": "2965291", "Resto": 0, "Reng": 1, "IdSeq": 0,
          "IdArticulo": "A00123", "Descr": "LAPIZ ADHESIVO 40 GR",
          "IdColor": 0, "sColor": "", "IdPres": 2, "Pres": "CAJA C/12",
          "Tipo": 1, "CantPed": 24, "CantSur": 24, "CantEnt": 24, "CantRes": 0, "CantBO": 0,
          "PUnit": 18.50, "PorcIVA": 16, "Iva": 71.04, "Importe": 444.00,
          "Activo": true, "Simbolo": ""
        }
      ]
    }
  }
  ```

  ### Errores (mismo sobre)

  ```json
  { "response": { "IdError": true, "Respuesta": "Se requiere el usuario (IdUser)." } }
  { "response": { "IdError": true, "Respuesta": "Numero de pedido invalido." } }
  ```

  ---

  ## 9. Campos de respuesta `ttDetPedidoLee`

  Salida en camelCase, **sin las columnas duplicadas con guion** (`Id-Pedido`/`Id-Articulo`/`Id-color`/`Id-pres`/`Id-Seq`). Principales:

  **`IdPedido`** · STRING — Folio · **`Resto`** · INTEGER · **`Reng`** · INTEGER — Renglón · **`IdSeq`** · INTEGER
  **`IdArticulo`** · STRING — Código del artículo · **`Descr`** · STRING — Descripción
  **`IdColor`** · INTEGER · **`sColor`** · STRING — Nombre del color · **`IdPres`** · INTEGER · **`Pres`** · STRING — Descripción de la presentación
  **`Tipo`** · INTEGER — 1 = artículo; 2 = comentario; 3/4 = cortes
  **`CantPed`** · DECIMAL — Cantidad pedida · **`CantSur`** · DECIMAL — surtida · **`CantEnt`** · DECIMAL — entregada · **`CantFac`** · DECIMAL — facturada
  **`CantRes`** · DECIMAL — Reservada (= `CantPed − CantEnt` cuando `Tipo < 3` y hay pendiente) · **`CantBO`** · DECIMAL — Backorder
  **`PUnit`** · DECIMAL — Precio unitario · **`PorcIVA`** · DECIMAL · **`Iva`** · DECIMAL · **`Importe`** · DECIMAL · **`Costo`** · DECIMAL
  **`Activo`** · BOOLEAN — `true` si el artículo/color/presentación siguen activos en catálogo
  **`Simbolo`** · STRING — Símbolo de moneda si el renglón no es moneda 1

  > También trae los demás campos de `DetPedido` en camelCase (almacén, ubicación, corte, etc.).

  ---

  ## 10. Reglas y Notas

  1. **Contrato nuevo:** exige `IdUser` y devuelve el sobre `{ IdError, Respuesta, ttDetPedidoLee }`.
  2. **Salida limpia:** `leeDetPedido` devuelve `ttDetPedidoLee` (solo lectura, camelCase). **No** se modificó el include `detpedido.i` (compartido con la BusinessEntity `detpedido.cls`, cuyo create/update usa los campos con guion como entrada); por eso la limpieza se hace en una temp-table de salida aparte.
  3. Sin `Resto` se devuelven los renglones de **todos** los restos del folio.
  4. **Regenerar el servicio** en PDSOE (anotaciones) tras el cambio de firma, y compilar `detpedido.p`.

  ---

  ## 11. Plan de Pruebas

  | # | Caso | Esperado |
  |---|------|----------|
  | P1 | Sin `IdUser` | `"Se requiere el usuario (IdUser)."` |
  | P2 | Folio no numérico / 0 | `"Numero de pedido invalido."` |
  | P3 | Pedido con renglones | Lista con artículo/color/presentación/cantidades |
  | P4 | Sin `Resto` | Renglones de todos los restos del folio |
  | P5 | Renglón con pendiente (`Tipo<3`, `CantPed>CantEnt`) | `CantRes = CantPed − CantEnt` |
  | P6 | Artículo dado de baja en catálogo | `Activo = false` |

  ---
