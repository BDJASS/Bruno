  > El primer renglón tiene solo solicitud de cancelación; el segundo tiene solicitud **y** cancelación por CEDIS, y conserva `IdEstatus = 6` (Embarcado): la bandera `PedCanc` es la que indica que está cancelado.

  ### Campos de `ttPedidoLee` (1 registro por pedido)

  **`IdPedido`** · STRING — Folio del pedido
  **`Resto`** · INT — Resto del pedido
  **`FecReg`** · DATE — Fecha de registro
  **`IdCliente`** · INT — Clave del cliente
  **`RazonSocial`** · STRING — Razón social del pedido
  **`IdVendedor`** · STRING — Clave del vendedor
  **`VendNombre`** · STRING — Nombre del empleado vendedor; vacío si no se localizó
  **`SubTotal`** · DECIMAL — Subtotal del pedido
  **`PartDetPed`** · INT — Número de partidas (renglones `Tipo` 1-2)
  **`Pago`** · STRING — Estado de pago: si es crédito → `CREDITO`; si es contado → `PAGADO`, `PDTE. PAGO`, `CONTRA ENTREGA` o `PDTE. CHEQUE` según corresponda
  **`Estatus`** · STRING — Estatus legible del pedido
  **`IdEstatus`** · INT — Estatus numérico del pedido (`Pedido.Id-Estatus`)
  **`IdCond`** · INT — Condición de venta (`Pedido.Id-Cond`); `0` = contado
  **`EnFirme`** · BOOLEAN — `true` = pedido autorizado / en firme
  **`BckOrd`** · INT — Política de backorder (`Pedido.bckOrd`)
  **`Pagado`** · BOOLEAN — `true` = pedido pagado
  **`PagAnt`** · BOOLEAN — `true` = pago anticipado
  **`PausaReja`** · BOOLEAN — `true` = el pedido tiene pausa en reja (`Pedido.PausaReja`)
  **`IdLiga`** · STRING — Ligas del pedido (`Pedido.Id-Liga`); **vacío = no ligado**, con valor = ligado (prefijo `F` = liga de facturación, `E` = liga de embarque)
  **`Ubi`** · STRING — Ubicación de venta del pedido (`Pedido.Id-UbiVta`)
  **`Plazo`** · INT — Plazo del pedido (`Pedido.Plazo`)
  **`TieneSeguimiento`** · BOOLEAN — `true` = existe renglón en `EstPedido` para este pedido-resto; `false` = no hay seguimiento. El front debe llamar a `/Ventas/Pedidos/Seguimiento` **solo cuando es `true`** (evita el `IdError` "No existe informacion de seguimiento…"). Se resuelve con un sondeo sobre el índice UNIQUE primario `idx-sur` (`Id-Pedido` + `Id-Seq`), el mismo `WHERE` que usa ese servicio
  **`FacturaSI`** · BOOLEAN — `true` = el pedido es **posible a facturar** con la misma regla de los listados `/Pedido/listaPedidosPorFacturar` (clientes normales) y `/Pedido/listaPedidosEspeciales` (clientes de embarque especial); `false` = no facturable. Se evalúa sobre su registro de empaque `EstPedido` (ver sección 13)
  **`Adelantado`** · BOOLEAN — `true` = factura por adelantado (`Pedido.Adelantado`); el grid muestra el indicador "FA" y deshabilita el botón Editar (ticket 3796)

  #### Solicitud de Cancelación y Cancelación por CEDIS (ticket 3819)

  > Solicitud de Cancelación y Cancelación del pedido son **independientes**: un pedido puede tener ambas, solo una o ninguna. Sin solicitud/cancelación las banderas llegan en `false`, los textos vacíos y las fechas en `null`. `IdEstatus`/`Estatus` **no cambian** (un pedido cancelado puede seguir en `6` Embarcado; la bandera `PedCanc` es la que lo identifica).

  **`SolCanc`** · BOOLEAN — `true` = el pedido tiene solicitud de cancelación (`Pedido.SolCancPed`)
  **`SolCancUsu`** · STRING — Usuario que generó la solicitud (`Pedido.UsuSolCancPed`)
  **`SolCancNom`** · STRING — Nombre del usuario que generó la solicitud (`Empleado.Nombre` por iniciales); vacío si no se localizó
  **`SolCancFec`** · DATE — Fecha de la solicitud (`Pedido.FecSolCancPed`)
  **`SolCancHora`** · STRING — Hora de la solicitud `HH:MM:SS` (`Pedido.HorSolCancPed`)
  **`SolCancMotivo`** · STRING — Motivo de la solicitud (`Pedido.MotivoSolCancPed`)
  **`PedCanc`** · BOOLEAN — `true` = el pedido está cancelado por CEDIS (`Pedido.Cancelado`)
  **`CancUsu`** · STRING — Usuario que canceló (`Pedido.UsuarioCanc`)
  **`CancNom`** · STRING — Nombre del usuario que canceló (`Empleado.Nombre` por iniciales); vacío si no se localizó
  **`CancFec`** · DATE — Fecha de cancelación (`Pedido.FecCancel`)
  **`CancHora`** · STRING — Hora de cancelación `HH:MM:SS`; hoy **siempre vacío**: el esquema `Pedido` no guarda la hora de cancelación (ver sección 13)

  #### Documento de venta (ticket 3819)

  **`IdFactura`** · STRING — Folio del documento de venta del pedido (`Pedido.Id-Factura`); puede ser factura o remisión; vacío si no se ha facturado
  **`FecFactura`** · DATE — Fecha (`FecReg`) del documento de `IdFactura`: se busca en `Factura` y, si no existe, en `Remision`, ambos con el `Id-Cliente` del pedido; `null` si no hay folio o no se localizó
  **`IdFuente`** · INT — Fuente del pedido (`Pedido.Id-Fuente`)

  ---

  ## 9. Validaciones del Servicio

  | Condición | Comportamiento |
  |-----------|----------------|
  | `IdUser` vacío | `IdError: true` — `"Se requiere el usuario (IdUser)."` |
  | Pedido/Resto/Vendedor/Cliente/Estatus no numéricos | `IdError: true` — mensaje correspondiente |
  | Fechas inválidas | `IdError: true` — `"Fecha inicial invalida."` / `"Fecha final invalida."` |
  | Sin `IdPedido` y sin rango de fechas completo | `IdError: true` — `"Si no se especifica el pedido, el rango de fechas (ctFecRegIni y ctFecRegFin) es obligatorio."` |
  | Folio (7 dígitos) inexistente | `IdError: true` — `"No existe pedido con ese folio."` o motivo de cancelación (`LogBaja`) |

  ---

  ## 10. Evidencia de Ejecución

  *Pendiente de captura por parte del equipo de QA.*

  ---

  ## 11. Fecha de Prueba

  | Ambiente | Fecha         | Ejecutado por |
  |----------|---------------|---------------|
  | DEV      | *(pendiente)* | *(pendiente)* |

  ---

  ## 12. Resultado

  | Estado              | Descripción                                                       |
  |---------------------|-------------------------------------------------------------------|
  | ⏳ Pendiente prueba | Servicio desplegado en DEV. Pendiente de ejecución formal por QA. |

  ---

  ## 13. Observaciones Técnicas

  1. **Programa dedicado y ligero:** `pedconsulta.p` construye directamente las columnas del grid mientras recorre los pedidos, sin armar el registro completo ni volcar una tabla al final. Reemplaza el uso de `pedido2.p` / `leePedidos` (que se removió de `pedido2.p`; ese programa conserva `creaPedidos`/`actPedidos`).
  2. **`Pago`:** si `Id-Cond <> 0` → `CREDITO`. Si es contado (`Id-Cond = 0`): `PAGADO` si está pagado; si no, `PDTE. PAGO` (pago anticipado) o `CONTRA ENTREGA`; y `PDTE. CHEQUE` si `FEFormaPago = "02"` sin número de cheque.
  3. **`Estatus`:** clasificación calculada (homologada con `vtac1300.p`): No-Aut, Mcia-Pdte, Mcia-P/Surt, P/Facturar, Cte-Recoge, Emb-Local, Emb-Estafeta, Emb-Foraneo, o la descripción de `EstVta`. La categoría "Mcia-Pdte" usa el conteo de renglones `Tipo = 1` con `CantEnt < CantPed`.
  4. **Filtro de pendientes:** si `IdEstatus = -99`, solo se devuelven los pedidos cuya clasificación resultó "pendiente".
  5. **Rango de fechas obligatorio sin pedido:** ver sección 9.
  6. **Eficiencia:** por cada pedido se hace un solo recorrido del detalle (`DetPedido`), un `FIND EstVta`, el nombre del vendedor (`Vendedor` → `Empleado`) y un sondeo único de `EstPedido` que alimenta a la vez `TieneSeguimiento` y `FacturaSI`. Las lecturas adicionales son condicionales: `Empleado` solo si hay solicitud/cancelación con usuario, y `Factura`/`Remision` solo si el pedido tiene folio. No se consultan ruta, condición, entrega, transporte, etc. (esos datos viven en `/Ventas/Pedido/Resumen`).
  7. **`FacturaSI` (ticket 3291):** replica la **unión** de los dos listados de facturación de `pedfactura.p`, ambos gobernados por el registro de empaque `EstPedido` (1:1 con el pedido-resto vía `Id-Pedido` + `Id-Seq` = `Resto`):
     - `EstPedido.Estatus = 4` (empacado) → `true` para cualquier cliente (cubre normales y especiales).
     - `EstPedido.Estatus` 0, 1 o 2 con `Pedido.Adelantado = true` → `true` (facturación adelantada).
     - `EstPedido.Estatus = -2` (remisionado) sin `Id-Factura` y `Cliente.EmbEsp = true` → `true` (solo clientes de embarque especial).

     Se **omite a propósito** el filtro por almacén/prefijo del `Id-Pedido` que traen esos listados (solo segmenta la cola de facturación de cada CEDIS); aquí la bandera indica si el pedido es facturable en sí, sin importar la ubicación del usuario. Es una bandera de **membresía en el listado por facturar**, no la validación profunda por pedido (`/Pedido/validaPedidoFacturable` sigue aplicando bloqueos como RFC incompleto, ya facturado, solicitud de cancelación, corte del día, etc. al momento de facturar).
  8. **Solicitud de Cancelación / Cancelación (ticket 3819):** se leen del mismo registro `Pedido` que ya recorre la consulta, así que no hay consulta extra por renglón; solo se busca el nombre en `Empleado` (por `Iniciales`, mismo criterio que `/Ventas/Pedidos/SolicitudCancelacion`) cuando la bandera está activa y hay usuario. Los datos de cada bloque se envían únicamente si su bandera es `true`. `CancHora` queda vacío porque `Pedido` solo tiene `Cancelado`, `FecCancel` y `UsuarioCanc`; para llenarlo haría falta agregar un campo de hora de cancelación a la tabla y grabarlo en el proceso de cancelación de CEDIS.
  9. **`FecFactura` (ticket 3819):** `Pedido.Id-Factura` puede ser folio de factura o de remisión y el pedido no indica cuál. Se busca primero en `Factura` (`Id-Factura` + `Id-Cliente` del pedido) y, si no existe, en `Remision` (`Id-Remision` + `Id-Cliente`); se toma su `FecReg`. El `Id-Cliente` evita tomar un folio igual de otro cliente. Se devuelve la fecha aunque el documento esté cancelado. Sin folio o sin documento → `null`.
  10. **Autenticación:** servicio sobre OpenEdge PASOE; si el ambiente requiere Bearer, incluir `Authorization: Bearer <token>`.

  ---
  **Desarrollado por:** SIS10 - JASS
