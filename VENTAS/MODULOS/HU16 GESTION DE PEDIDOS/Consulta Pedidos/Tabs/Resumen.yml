docs: |
  # Servicio REST — Resumen de Pedido

  ---

  ## 1. Título del Servicio

  **Resumen de Pedido (Resumen)**
  A partir de un pedido (`IdPedido` + `Resto`) retorna, en un solo dataset, tres tablas **independientes** con el resumen del pedido: identidad fiscal del cliente, datos generales del pedido y dirección de embarque.
  Programa servidor: `pedresumen.p` · Procedimiento: `getResumen` | Las tres tablas son independientes (sin data-relation): si alguna queda vacía, el dataset se arma igual.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Ventas/Pedido/Resumen
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`IdPedido`** · STRING · ✅ — Folio del pedido
  **`Resto`** · STRING · ❌ — Resto del pedido · Vacío = primero encontrado
  **`IdUser`** · STRING · ✅ — Usuario que ejecuta la consulta

  ---

  ## 5. Body

  No aplica. Método `GET`.

  ---

  ## 6. Headers

  | Header         | Valor                                  |
  |----------------|----------------------------------------|
  | `Accept`       | `application/json`                     |
  | `Content-Type` | `application/json` *(opcional en GET)* |

  ---

  ## 7. Ejemplo de Request

  ```
  GET .../Ventas/Pedido/Resumen?IdUser=olds&IdPedido=0322707&Resto=0
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
