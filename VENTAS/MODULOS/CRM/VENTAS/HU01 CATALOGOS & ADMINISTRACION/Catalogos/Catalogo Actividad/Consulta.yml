docs: |
  # Servicio REST — Consulta de Actividades

  ---

  ## 1. Título del Servicio

  **Consulta del Catálogo de Actividades (HU-01, 5.0)**
  Lista las actividades operativas de atención del ticket, con el conteo de uso (cuántas soluciones las usan).
  Programa: `catactividad.p` · Procedimiento: `leeActividad`.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Catalogo/Actividad/Consulta
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  - **`Busqueda`** · STRING · ❌ — Texto parcial sobre el Nombre. Vacío = todas.
  - **`IdUser`** · STRING · ✅ — Usuario que consulta.

  ---

  ## 5. Body

  No aplica. Método `GET`.

  ---

  ## 6. Headers

  | Header         | Valor                                  |
  |----------------|----------------------------------------|
  | `Accept`       | `application/json`                     |
  | `Content-Type` | `application/json` *(opcional en GET)* |

  ---

  ## 7. Ejemplo de Request

  ```
  GET .../Catalogo/Actividad/Consulta?Busqueda=&IdUser=olds
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Consulta ejecutada correctamente.",
    "ttActividad": [
      { "Id": 1, "Nombre": "Surtido", "Activo": true, "Uso": 4 }
    ]
  }
  ```

  ---

  ## 9. Campos de la Respuesta

  **`ttActividad`** — arreglo de actividades:
  - **`Id`** · INTEGER — Clave de la actividad (ACT-999).
  - **`Nombre`** · CHARACTER — Nombre de la actividad.
  - **`Activo`** · BOOLEAN — Estado (baja lógica).
  - **`Uso`** · INTEGER — Nº de soluciones que la tienen asignada (`SolucionActividad`).

  - **`IdError`** · BOOLEAN — `true` si falló una validación o hubo error; `false` si la operación fue correcta.
  - **`Respuesta`** · CHARACTER — Mensaje amigable de resultado (no expone verbos HTTP ni errores técnicos).

  ---

  ## 10. Reglas y Validaciones

  - **`IdUser` es obligatorio** en todos los endpoints; si viene vacío o nulo → `IdError = true` con `"Se requiere el usuario (IdUser)."`.
  - Ordenada por Nombre.
  - Ante cualquier fallo la respuesta es amigable y `IdError = true`; nunca se realiza la operación a medias (transacción con `UNDO`).

  ---
  **Desarrollado por:** SIS10 - JASS
