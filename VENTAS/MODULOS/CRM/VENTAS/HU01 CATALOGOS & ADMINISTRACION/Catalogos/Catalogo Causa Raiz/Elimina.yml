docs: |
  # Servicio REST — Baja de Causa Raíz

  ---

  ## 1. Título del Servicio

  **Eliminación (física) del Catálogo de Causas Raíz (HU-01, 3.0)**
  Elimina **físicamente** la causa raíz **y quita sus vinculaciones** (`ProblemaCausa`), **solo si NO llega a ninguna incidencia**. Estar vinculada a categorías/problemas no bloquea; solo bloquea si la cadena (o `IncidenciaCausa`) alcanza una incidencia real.
  Programa: `catcausaraiz.p` · Procedimiento: `eliminaCausaRaiz`.

  ---

  ## 2. Método HTTP

  ```
  DELETE
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Catalogo/CausaRaiz/Elimina
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  - **`Id`** · INTEGER · ✅ — Id de la causa raíz.
  - **`IdUser`** · STRING · ✅ — Usuario que ejecuta la baja.

  ---

  ## 5. Body

  No aplica — los parámetros viajan en el **Query String** (ver secciones 4 y 7).

  ---

  ## 6. Headers

  | Header         | Valor                                  |
  |----------------|----------------------------------------|
  | `Accept`       | `application/json`                     |
  | `Content-Type` | `application/json`                     |

  ---

  ## 7. Ejemplo de Request

  ```
  DELETE http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Catalogo/CausaRaiz/Elimina?Id=3&IdUser=olds
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Registro eliminado: 30 - Error de etiquetado en origen (incluyendo sus vinculaciones)."
  }
  ```

  ---

  ## 9. Campos de la Respuesta

  - **`IdError`** · BOOLEAN — `true` si falló una validación o hubo error; `false` si la operación fue correcta.
  - **`Respuesta`** · CHARACTER — Mensaje amigable de resultado (no expone verbos HTTP ni errores técnicos).

  ---

  ## 10. Reglas y Validaciones

  - **`IdUser` es obligatorio** en todos los endpoints; si viene vacío o nulo → `IdError = true` con `"Se requiere el usuario (IdUser)."`.
  - `Id` debe existir.
  - **Bloqueo (avisa y NO elimina):** solo si la causa **llega a una incidencia** — directo por `IncidenciaCausa` o por cadena `ProblemaCausa → Problema → DetIncidencia` → `"No se puede eliminar: la causa raiz esta ligada a una o mas incidencias."`. Estar solo vinculada a categorías SIN incidencia **no** bloquea.
  - Si no llega a incidencia: **eliminación FÍSICA** (`DELETE`) de la causa **+ borrado de sus vínculos** `ProblemaCausa`.
  - Mensaje de éxito: `"Registro eliminado: <Id> - <Nombre> (incluyendo sus vinculaciones)."`.
  - Toda Alta / Actualización / Baja registra auditoría (`programas/auditoria.p`, app `oeVentas`).
  - Ante cualquier fallo la respuesta es amigable y `IdError = true`; nunca se realiza la operación a medias (transacción con `UNDO`).

  ---
  **Desarrollado por:** SIS10 - JASS
