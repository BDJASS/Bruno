docs: |
  # Servicio REST — Agregar Actividad a una Solución

  ---

  ## 1. Título del Servicio

  **Agregar Actividad a una Solución (HU-01 / HU-12)**
  Mantenimiento fino de una **solución ya existente**: agrega una actividad del puente `SolucionActividad` sin rehacer toda la solución (complementa al Alta `/Catalogo/Solucion/Alta`).
  Programa servidor: `catsolucion.p` · Procedimiento: `agregaActividad`.

  ---

  ## 2. Método HTTP

  ```
  POST
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Catalogo/Solucion/Actividad/Agrega
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido

  **`IdSolucion`** · INTEGER · ✅ — Solución a modificar (debe existir).
  **`IdActividad`** · INTEGER · ✅ — Actividad a agregar.
  **`IdUser`** · STRING · ✅ — Usuario que ejecuta.

  ---

  ## 5. Body

  No aplica. Todo va en el query string.

  ---

  ## 6. Headers

  | Header         | Valor                |
  |----------------|----------------------|
  | `Accept`       | `application/json`   |

  ---

  ## 7. Ejemplo de Request

  ```
  POST http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Catalogo/Solucion/Actividad/Agrega?IdSolucion=12&IdActividad=4&IdUser=jjlg
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Actividad agregada a la solucion."
  }
  ```

  ---

  ## 9. Campos de la Respuesta

  **`IdError`** · BOOLEAN — `true` si falló una validación o hubo error.
  **`Respuesta`** · CHARACTER — Mensaje amigable de resultado.

  Registro de puente creado en `SolucionActividad` (Id-Solucion, Id-Actividad, Orden).

  ---

  ## 10. Reglas y Validaciones

  - **`IdUser` obligatorio**; vacío/nulo → `IdError=true`.
  - **`IdSolucion`** debe existir (tabla `Solucion`).
  - **`IdActividad`** debe existir y estar **activo** en su catálogo (`Actividad`).
  - **Sin duplicar:** si la actividad ya está ligada a la solución → `IdError=true` con "ya pertenece a la solucion" (no se crea otra vez).
  - El `Orden` se asigna al final (máximo actual + 1).
  - Operación transaccional (`UNDO`): ante error no se guarda a medias.

  ---
  **Desarrollado por:** SIS10 - JASS
