docs: |
  # Servicio REST — Actualización de Catálogo Simple

  ---

  ## 1. Título del Servicio

  **Actualización de Catálogo Simple (HU-01)**
  Edita el nombre y/o el estado (Activo) de un registro de catálogo simple. Catálogos válidos: `Competencia` · `FrecuenciaProy` · `MotivoDesactNR` · `MotivoPerdidaVta` · `MotivoReasignTM` · `Desventaja` · `OrigenLead`.
  Programa: `catsimple.p` · Procedimiento: `actualizaCatalogo`.

  ---

  ## 2. Método HTTP

  ```
  PUT
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Catalogo/Simple/Actualiza
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  - **`Catalogo`** · STRING · ✅ — Cuál catálogo.
  - **`Id`** · INTEGER · ✅ — Id del registro a editar.
  - **`Nombre`** · STRING · ✅ — Nueva descripción. Obligatoria, sin duplicar.
  - **`Activo`** · STRING · ❌ — Estado: `"true"` / `"false"` (también acepta `1`/`si`/`yes`). **Si NO se envía (o vacío), se conserva el valor actual** (no se pone en null).
  - **`IdUser`** · STRING · ✅ — Usuario que edita.

  ---

  ## 5. Body

  No aplica — los parámetros viajan en el **Query String** (ver secciones 4 y 7).

  ---

  ## 6. Headers

  | Header         | Valor                                  |
  |----------------|----------------------------------------|
  | `Accept`       | `application/json`                     |
  | `Content-Type` | `application/json`                     |

  ---

  ## 7. Ejemplo de Request

  ```
  PUT http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Catalogo/Simple/Actualiza?IdUser=jjlg&Catalogo=Competencia&Nombre=Ejemplo Nuevo 2&Id=24&Activo=false
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Registro actualizado: 9 - Lumen S.A."
  }
  ```

  ---

  ## 9. Campos de la Respuesta

  - **`IdError`** · BOOLEAN — `true` si falló una validación o hubo error; `false` si la operación fue correcta.
  - **`Respuesta`** · CHARACTER — Mensaje amigable de resultado (no expone verbos HTTP ni errores técnicos).

  ---

  ## 10. Reglas y Validaciones

  - **`IdUser` es obligatorio** en todos los endpoints; si viene vacío o nulo → `IdError = true` con `"Se requiere el usuario (IdUser)."`.
  - `Id` obligatorio y debe existir (`"No se encontro el registro."`).
  - `Nombre` obligatorio y sin duplicar contra OTRO registro del mismo catálogo.
  - **`Activo` es opcional:** si NO se envía (nulo o vacío) **se conserva el valor actual**; solo se cambia cuando viene. Si viene, se interpreta como texto: `true/1/si/yes` = activo; cualquier otro = inactivo.
  - Se toma el registro con `EXCLUSIVE-LOCK NO-WAIT`; si está ocupado → `"Registro ocupado, intente de nuevo."`.
  - Mensaje de éxito: `"Registro actualizado: <Id> - <Nombre>."`.
  - Toda Alta / Actualización / Baja registra auditoría (`programas/auditoria.p`, app `oeVentas`).
  - Ante cualquier fallo la respuesta es amigable y `IdError = true`; nunca se realiza la operación a medias (transacción con `UNDO`).

  ---
  **Desarrollado por:** SIS10 - JASS
