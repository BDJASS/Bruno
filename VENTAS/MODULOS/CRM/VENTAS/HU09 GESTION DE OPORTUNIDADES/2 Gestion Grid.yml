docs: |
  # Servicio REST — Gestión de Oportunidades (Grid)

  ---

  ## 1. Título del Servicio

  **Gestión de Oportunidades — Grid (HU-09)**
  Grid del pipeline con filtros (texto, etapa, vendedor, estado). Devuelve valor ponderado, probabilidad por etapa, semáforo de cierre y los contadores de objeciones y visitas de cada oportunidad.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Oportunidad/Gestion
  ```

  ---

  ## 4. Parámetros de entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`Busqueda`** · STRING · ❌ — Texto parcial en folio, nombre o razón social (insensible a may/min).
  **`IdEtapa`** · INTEGER · ❌ — FK `EtapaPipeline`. `0`/vacío = todas.
  - `1` Receptividad · `2` Enfoque · `3` Conocimiento · `4` Evaluación · `5` Decisión

  **`IdVendedor`** · STRING · ❌ — Filtra por vendedor. Vacío o `Todos` = todos.
  **`IdEstado`** · INTEGER · ❌ — FK `EstadoOportunidad`. `0`/vacío = todos.
  - `1` Activa · `2` Ganada · `3` Perdida

  **`IdUser`** · STRING · ✅ — Usuario que ejecuta.

  ---

  ## 5. Body

  No aplica. Método `GET`.

  ---

  ## 6. Headers

  | Header         | Valor                |
  |----------------|----------------------|
  | `Accept`       | `application/json`   |
  | `Content-Type` | `application/json`   |

  ---

  ## 7. Ejemplo de Request

  ```
  GET .../Oportunidad/Gestion?Busqueda=&IdEtapa=0&IdVendedor=Todos&IdEstado=1&IdUser=jjlg
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Oportunidades encontradas: 1.",
    "dsGrid": {
      "ttGrid": [
        {
          "Id": 1, "Folio": "OPP-2026-0001", "IdCliente": 55987,
          "Cuenta": "COMERCIAL DEL NORTE SA", "Nombre": "Equipamiento oficinas 2026",
          "IdEtapa": 2, "Etapa": "Enfoque", "ProbCierre": 25,
          "IdVendedor": "5197", "Vendedor": "JULIA LUCIO GARCIA",
          "Valor": 250000.00, "ValorPonderado": 62500.00,
          "IdEstado": 1, "Estado": "Activa",
          "FecTentCierre": "2026-10-15", "DiasCierre": 43, "Semaforo": "En tiempo",
          "NumObjeciones": 0, "NumVisitas": 2
        }
      ]
    }
  }
  ```

  ---

  ## 9. Campos de la Respuesta (`ttGrid`)

  **`Id`** · INTEGER — `Id-Oportunidad`.
  **`Folio`** · STRING — `OPP-AAAA-NNNN`.
  **`IdCliente`** / **`Cuenta`** · INTEGER/STRING — Cuenta y su razón social.
  **`Nombre`** · STRING — Nombre de la oportunidad.
  **`IdEtapa`** / **`Etapa`** · INTEGER/STRING — Etapa del pipeline.
  **`ProbCierre`** · INTEGER — Probabilidad por etapa/estado (Recept 10, Enfoque 25, Conoc 40, Eval 60, Decis 80, Ganada 100, Perdida 0).
  **`IdVendedor`** / **`Vendedor`** · STRING — Vendedor (nombre vía `Empleado`).
  **`Valor`** · DECIMAL — Presupuesto estimado.
  **`ValorPonderado`** · DECIMAL — `Valor × ProbCierre ÷ 100`.
  **`IdEstado`** / **`Estado`** · INTEGER/STRING — Activa/Ganada/Perdida.
  **`FecTentCierre`** · DATE · **`DiasCierre`** · INTEGER — Días a cierre (+ restantes, − vencida).
  **`Semaforo`** · STRING — `Vencida` · `Urgente` (≤7 días) · `En tiempo` · `Sin fecha` · `-` (si no está Activa).
  **`NumObjeciones`** · INTEGER — Conteo de `OportObjecion`.
  **`NumVisitas`** · INTEGER — Conteo de `AgendaVC` ligadas (HU-05).

  ---

  ## 10. Reglas y Validaciones

  - `IdUser` obligatorio.
  - Solo lista oportunidades con `Activo=true`, ordenadas por `FecReg` descendente.
  - Semáforo y días se recalculan en cada consulta (no se persisten).

  ---
  **Desarrollado por:** SIS10 - JASS
