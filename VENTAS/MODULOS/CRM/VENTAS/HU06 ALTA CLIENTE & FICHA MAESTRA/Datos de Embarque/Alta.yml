docs: |
  # Servicio REST — Alta de Datos de Embarque

  Registra una o varias direcciones de embarque nuevas para un cliente. Un
  cliente puede tener **varias** direcciones, cada una identificada por su
  código **`IdCliEmb`**. Reglas basadas en el proceso de captura de embarques
  en modo caracter.

  ---

  ## 1. Método HTTP

  ```
  POST
  ```

  ---

  ## 2. URL

  ```
  /GestionCliente/DatosEmbarque/Alta
  ```

  ---

  ## 3. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  - **`IdUser`** · STRING · ✅ — Usuario que da de alta (queda en la auditoría).

  ---

  ## 4. Body (JSON)

  Arreglo `ttCliEmb` con una o varias direcciones a registrar.

  > ✅ = Obligatorio · ❌ = Opcional · 🟡 = Recomendado

  ### Campos obligatorios

  - ✅ **`IdCliente`** · INTEGER — Cliente al que pertenece la dirección. Debe existir.

  ### Campos opcionales

  - ❌ **`IdCliEmb`** · STRING — Código de la dirección de embarque. Es opcional
    (hay direcciones sin código); si se envía con valor, no debe estar repetido
    para el mismo cliente.

  - 🟡 **`RazonSocial`** · STRING — Razón social de la dirección de embarque.

  - 🟡 **`Calle`** · STRING — Calle y número (`CalleNo`).

  - 🟡 **`Colonia`** · STRING — Colonia.

  - 🟡 **`IdCiudad`** · INTEGER — Id de la ciudad. **Si se envía**, el servicio
    deriva y guarda automáticamente la ciudad, el estado y el país (no necesitas
    mandar `Poblacion`/`Estado`); si no existe → error.

  - ❌ **`Poblacion`** · STRING — Ciudad. Solo se usa si **no** envías `IdCiudad`.

  - ❌ **`Estado`** · STRING — Estado. Solo se usa si **no** envías `IdCiudad`.

  - ❌ **`Delegacion`** · STRING — Delegación / municipio.

  - 🟡 **`CP`** · STRING — Código postal. Si se envía, se valida.

  - ❌ **`ReferenciaEmbarque`** · STRING — Referencias de ubicación para la entrega.

  - 🟡 **`Telefono`** · STRING — Teléfono de contacto de la dirección.

  - ❌ **`Correo`** · STRING — Correo de contacto.

  - 🟡 **`Atencion`** · STRING — Persona de atención. No admite comillas ni `&`.

  - ❌ **`RutaEmbarque`** · INTEGER — Ruta de embarque. Si se envía (distinta de `0`), debe existir.

  > **Nulos:** un campo de texto opcional puede omitirse o enviarse como `null`;
  > el servicio lo trata como vacío (no falla).

  ---

  ## 5. Headers

  | Header         | Valor              |
  |----------------|--------------------|
  | `Accept`       | `application/json` |
  | `Content-Type` | `application/json` |

  ---

  ## 6. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Se registraron 1 direccion(es) de embarque."
  }
  ```

  ---

  ## 7. Campos de la Respuesta

  - **`IdError`** · BOOLEAN — `true` si falló una validación o hubo error; `false` si fue correcto.

  - **`Respuesta`** · STRING — Mensaje amigable de resultado.

  ---

  ## 8. Reglas y Validaciones

  - **`IdUser`** es obligatorio; si viene vacío o nulo → `IdError = true`.

  - El **cliente debe existir**; si no → `IdError = true`.

  - **`IdCliEmb`** es opcional; si se envía con valor, **no debe estar repetido**
    para ese cliente.

  - **`Atencion`** no debe contener comillas (`"` o `'`) ni el caracter `&`.

  - **`RutaEmbarque`**, si se envía distinta de `0`, debe existir.

  - **`CP`**, si se envía, se valida el código postal.

  - **`IdCiudad`**, si se envía, debe existir; el servicio guarda la ciudad, el
    estado y el país derivados del catálogo.

  - Cada dirección registrada genera **auditoría** en `CambioCte`
    (`Descr = "CliEmb"`, `ValorNuevo = IdCliEmb/Calle`, `ValorOld = "ALTA"`).

  - Ante cualquier fallo la respuesta es amigable y `IdError = true`.

  ---
  **Desarrollado por:** SIS10 - JASS
