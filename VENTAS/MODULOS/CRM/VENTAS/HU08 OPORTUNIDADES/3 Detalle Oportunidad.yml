  ---

  ## 9. Campos de la Respuesta

  **`ttDet`** — encabezado con todos los campos de la oportunidad (catálogos resueltos a nombre: `TipoProy`, `FrecProy`, `ProcAutoriz`, `Urgencia`, `Competencia`, `Etapa`, `Estado`). `Decisor*` = snapshot del contacto (`CteEmp`).
  **`ttCfsUI`** — prioridades CFS: **`IdPrioridad`** · INTEGER · **`Prioridad`** · STRING.
  **`ttCvbvUI`** — filas CVBV: **`Orden`** · INTEGER · **`Caracteristica`**/**`Ventaja`**/**`Beneficio`**/**`Validacion`** · STRING.
  **`ttVaUI`** — valor agregado: **`IdValorAgr`** · INTEGER · **`ValorAgregado`** · STRING.
  **`ttCorreoUI`** — correos de apoyo: **`Correo`** · STRING.
  **`ttDocUI`** — documentos adjuntos (**solo metadata**, sin el binario): **`IdDoc`** · INTEGER — para descargar con `/Oportunidad/Documento/Descarga` · **`TipoDoc`** · STRING (`Contrato`, ...) · **`NombreArchivo`** · **`MimeType`** · STRING · **`Tamano`** · DECIMAL (bytes) · **`FecCarga`** · DATETIME.

  > **Campos HU-09 en `ttDet`** (para el modal Ver/Editar de 6 pasos): `PctPenalizacion`, `DecisorTelefono`, `DescOportunidad`, `Observaciones`, `ValorTotalCuenta`, `CotizadoAFecha`, `ProxAccionResumen` (Paso 6), más `HuboObjeciones` (0=sin responder·1=Sí·2=No) y `EtapaMaxAlcanzada`.

  ---

  ## 10. Reglas y Validaciones

  - `IdUser` e `IdOportunidad` obligatorios.
  - Si la oportunidad no existe → `IdError=true` con mensaje amigable.

  ---
