docs: |
  # Servicio REST — Detalle de Oportunidad

  ---

  ## 1. Título del Servicio

  **Detalle de Oportunidad (HU-08)**
  Devuelve el detalle completo de una oportunidad con sus tablas hijas anidadas: prioridades CFS, tabla CVBV, valor agregado y correos de apoyo. Todos los catálogos vienen resueltos a su nombre.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Oportunidad/Detalle
  ```

  ---

  ## 4. Parámetros de entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`IdOportunidad`** · INTEGER · ✅ — Id de la oportunidad.
  **`IdUser`** · STRING · ✅ — Usuario que ejecuta.

  ---

  ## 5. Body

  No aplica. Método `GET`.

  ---

  ## 6. Headers

  | Header         | Valor                |
  |----------------|----------------------|
  | `Accept`       | `application/json`   |
  | `Content-Type` | `application/json`   |

  ---

  ## 7. Ejemplo de Request

  ```
  GET .../Oportunidad/Detalle?IdOportunidad=1&IdUser=jjlg
  ```

  ---

  ## 8. Ejemplo de Response (resumido)

  ```json
  {
    "IdError": false,
