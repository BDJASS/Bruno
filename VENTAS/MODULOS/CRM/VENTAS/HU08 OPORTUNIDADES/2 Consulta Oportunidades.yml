docs: |
  # Servicio REST — Consulta de Oportunidades (Grid)

  ---

  ## 1. Título del Servicio

  **Consulta de Oportunidades (HU-08)**
  Grid de oportunidades con filtros por vendedor, etapa del Pipeline, estado, periodo (fecha de alta) y texto (folio / nombre / razón social). Solo lista oportunidades activas, ordenadas por fecha de alta descendente.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Oportunidad/Consulta
  ```

  ---

  ## 4. Parámetros de entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`IdUser`** · STRING · ✅ — Usuario que ejecuta.
  **`IdVendedor`** · STRING · ❌ — Filtra por vendedor. Vacío o `Todos` = todos.
  **`IdEtapa`** · INTEGER · ❌ — FK `EtapaPipeline`. `0`/vacío = todas.
  - `1` Receptividad · `2` Enfoque · `3` Conocimiento · `4` Evaluación · `5` Decisión

  **`IdEstado`** · INTEGER · ❌ — FK `EstadoOportunidad`. `0`/vacío = todos.
  - `1` Activa · `2` Ganada · `3` Perdida

  **`FechaIni`** · STRING · ❌ — Inicio de periodo sobre fecha de alta (dd/mm/aaaa).
  **`FechaFin`** · STRING · ❌ — Fin de periodo sobre fecha de alta.
  **`Busqueda`** · STRING · ❌ — Texto parcial en folio, nombre o razón social (insensible a may/min).

  ---

  ## 5. Body

  No aplica. Método `GET`.

  ---

  ## 6. Headers

  | Header         | Valor                |
  |----------------|----------------------|
  | `Accept`       | `application/json`   |
  | `Content-Type` | `application/json`   |

  ---

  ## 7. Ejemplo de Request

  ```
  GET .../Oportunidad/Consulta?IdUser=jjlg&IdVendedor=Todos&IdEtapa=0&IdEstado=1&FechaIni=&FechaFin=&Busqueda=
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Oportunidades encontradas: 1.",
    "dsOportGrid": {
      "ttOppUI": [{
        "Id": 1, "Folio": "OPP-2026-0001", "IdCliente": 55987,
        "Cuenta": "COMERCIAL DEL NORTE SA", "Nombre": "Equipamiento oficinas 2026",
        "IdTipoProy": 3, "TipoProy": "Oficina", "Presupuesto": 250000.00,
        "IdVendedor": "5197", "Vendedor": "JULIA LUCIO GARCIA",
        "FecTentCierre": "2026-10-15", "IdEtapa": 2, "Etapa": "Enfoque",
        "IdEstado": 1, "Estado": "Activa", "MontoCotizado": 248500.00,
        "FecReg": "2026-08-31"
      }]
    }
  }
  ```

  ---

  ## 9. Campos de la Respuesta (`ttOppUI`)

  **`Id`** · INTEGER — `Id-Oportunidad`.
  **`Folio`** · STRING — `OPP-AAAA-NNNN`.
  **`IdCliente`/`Cuenta`** · INTEGER/STRING — Cuenta y su razón social.
  **`Nombre`** · STRING — Nombre de la oportunidad.
  **`IdTipoProy`/`TipoProy`** · INTEGER/STRING — Tipo de proyecto.
  **`Presupuesto`** · DECIMAL — Presupuesto estimado.
  **`IdVendedor`/`Vendedor`** · STRING — Vendedor responsable (nombre vía `Empleado`).
  **`FecTentCierre`** · DATE — Fecha tentativa de cierre.
  **`IdEtapa`/`Etapa`** · INTEGER/STRING — Etapa del Pipeline.
  **`IdEstado`/`Estado`** · INTEGER/STRING — Estado (Activa/Ganada/Perdida).
  **`MontoCotizado`** · DECIMAL — Monto cotizado final.
  **`FecReg`** · DATE — Fecha de alta.

  ---

  ## 10. Reglas y Validaciones

  - `IdUser` obligatorio.
  - Solo se listan oportunidades con `Activo=true`.
  - Orden por `FecReg` descendente (más recientes primero).

  ---
  **Desarrollado por:** SIS10 - JASS
