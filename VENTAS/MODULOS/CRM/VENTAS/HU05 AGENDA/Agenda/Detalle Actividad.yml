docs: |
  # Servicio REST - Detalle de una Actividad

  ## 1. Titulo
  **Detalle de Actividad de Agenda (HU-05)** - devuelve una actividad con sus **objetivos SMART** (dataset anidado). Programa `agenda.p` . Proc `detalleAgenda`.

  ## 2. Metodo
  ```
  GET
  ```
  ## 3. URL
  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Agenda/Detalle
  ```
  ## 4. Parametros (Query String)
  **`IdAgenda`** . INTEGER . OK - Actividad a consultar.
  **`IdUser`** . STRING . OK - Usuario.

  ## 7. Ejemplo
  ```
  GET http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Agenda/Detalle?IdAgenda=5&IdUser=jjlg
  ```
  ## 8. Response
  ```json
  {
    "IdError": false, "Respuesta": "Actividad encontrada.",
    "dsDetalle": { "ttDet": [ {
       "IdAgenda": 5, "IdVendedor": "001", "FecHoraIni": "2026-08-25T10:00:00", "FecHoraFin": "2026-08-25T11:00:00",
       "TipoCliente": "A", "IdCliente": 1024, "IdOportunidad": 12, "FolioOportunidad": "OPP-2026-0012", "NombreOportunidad": "OPORTUNIDAD CON CONTRATO",
       "Contacto": "Ana Ruiz", "IdLead": 0, "Cuenta": "ACME SA",
       "IdTipoActividad": 1, "TipoActividad": "Visita", "Titulo": "Visita Cliente", "Ubicacion": "Av. Industria 100",
       "IdEstatus": 2, "Estatus": "Realizada", "IdResultadoObt": 1, "ResultadoObt": "Exitoso - Objetivo Cumplido",
       "MotivoJustif": "", "NotasResultado": "", "ComentSeguimiento": "", "AcuerdosRealizados": "", "ProximosPasos": "",
       "ttObjUI": [ { "Orden": 1, "IdAccionSmart": 1, "Accion": "Obtener", "Metrica": "1 cotizacion firmada", "Proposito": "avanzar al cierre", "Enunciado": "" } ]
    } ] }
  }
  ```
  ## 9. Campos
  **`ttDet`** - todos los datos de la actividad (ids + descripcion de catalogos).
  **`IdOportunidad`** . INTEGER - Llave interna de la oportunidad (0 = sin oportunidad, p. ej. actividad de Lead).
  **`FolioOportunidad`** . STRING - Folio completo OPP-AAAA-NNNN, igual que el grid de Gestion de Oportunidades (Ticket 3765). Vacio si no hay oportunidad.
  **`NombreOportunidad`** . STRING - Nombre de la oportunidad (Ticket 3765). Vacio si no hay oportunidad.
   **`ttObjUI`** - objetivos SMART (Orden, Accion id+nombre, Metrica, Proposito, Enunciado).

  ---
  **Desarrollado por:** SIS10 - JASS
