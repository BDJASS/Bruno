docs: |
  # Servicio REST - Alta de Actividad (Agenda)

  ## 1. Titulo
  **Alta de Actividad en la Agenda (HU-05)** - crea la actividad con sus **objetivos SMART** (body dataset). Programa `agenda.p` . Proc `creaAgenda`.

  ## 2. Metodo
  ```
  POST
  ```
  ## 3. URL
  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Agenda/Alta
  ```
  ## 5. Body (dataset `dsAgenda`)
  > El usuario va en `ttEnc.IdUser`. `IdAgenda`=0 en alta.
  **`ttEnc`** (1): datos de la actividad. **`ttObj`** (1-3): objetivos SMART (Orden, IdAccionSmart, Metrica, Proposito).
  ```json
  {
    "dsAgenda": {
      "ttEnc": [
        {
          "IdAgenda": 0, "IdUser": "jjlg", "IdVendedor": "001",
          "FecHoraIni": "2026-08-25T10:00:00", "FecHoraFin": "2026-08-25T11:00:00",
          "TipoCliente": "A", "IdCliente": 1024, "IdOportunidad": 12, "Contacto": "Ana Ruiz", "IdLead": 0,
          "IdTipoActividad": 1, "Titulo": "Visita Cliente", "Ubicacion": "Av. Industria 100",
          "Descripcion": "Presentacion de propuesta", "MontoEstimado": 15000.00, "ProbCierre": 60,
          "Comentarios": "", "Observaciones": ""
        }
      ],
      "ttObj": [
        { "Orden": 1, "IdAccionSmart": 1, "Metrica": "1 cotizacion firmada", "Proposito": "avanzar al cierre", "Enunciado": "" }
      ]
    }
  }
  ```
  ## 7. Response
  ```json
  { "IdError": false, "Respuesta": "Actividad registrada en la agenda (1 objetivo(s) SMART).", "NuevoId": 5 }
  ```
  ## 9. Reglas
  - `IdUser`, `IdVendedor` (existente), `FecHoraIni`/`Fin` (fin>inicio, **mismo dia**), `IdTipoActividad` (activo), **1-3 objetivos SMART completos** (Accion+Metrica+Proposito).
  - **TipoCliente A**: `IdCliente` existente + `IdOportunidad` > 0 (FK suave HU-08/09). **TipoCliente B**: `IdLead` existente (Lead Nuevo -> primero `/Lead/Alta` de HU-07).
  - **RN-01 (ventana):** fecha desde el **lunes de la semana en curso** hasta **2 semanas a futuro**.
  - Estatus inicial = **Programada**. `Ubicacion` aplica a Visita/Demo (RN-05). Transaccional.

  ---
  **Desarrollado por:** SIS10 - JASS
