docs: |
  # Servicio REST — Catálogo Motivo de Cancelación del Lead

  ---

  ## 1. Título del Servicio

  **Catálogo Motivo de Cancelación del Lead (HU-07)**
  Devuelve el catálogo **Motivo de Cancelación** (solo activos) para el modal **Cancelar Lead** (`/Lead/Cancela`, parámetro `IdMotivoCancel`).
  Programa servidor: `lead.p` · Procedimiento: `leeMotivoCancel`.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Lead/MotivoCancelacion
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  - **`IdUser`** · STRING · ✅ — Usuario que ejecuta. Vacío/nulo → `IdError=true` con "Se requiere el usuario (IdUser).".

  ---

  ## 5. Body

  No aplica. Método `GET`.

  ---

  ## 6. Headers

  | Header         | Valor                                  |
  |----------------|----------------------------------------|
  | `Accept`       | `application/json`                     |
  | `Content-Type` | `application/json` *(opcional en GET)* |

  ---

  ## 7. Ejemplo de Request

  ```
  GET http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Lead/MotivoCancelacion?IdUser=jjlg
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Motivos de cancelacion encontrados: 6.",
    "ttCatCancel": [
      { "Id": 1, "Nombre": "Lead duplicado" },
      { "Id": 6, "Nombre": "Otro" }
    ]
  }
  ```

  ---

  ## 9. Campos de la Respuesta (ttCatCancel)

  - **`Id`** · INTEGER — Clave del motivo (`MotivoCancelacionLead.Id-MotCancelLead`). Es el valor que viaja como `IdMotivoCancel` en `/Lead/Cancela`.
  - **`Nombre`** · CHARACTER — Texto del motivo para el combo.

  Campos de salida generales — **`IdError`** · BOOLEAN · **`Respuesta`** · CHARACTER.

  ---

  ## 10. Notas

  - Solo devuelve registros con `MotivoCancelacionLead.Activo = TRUE`, ordenados por Id.
  - Se puebla vía `inccargacatalogos2.p`. Valores base: Lead duplicado · Datos erroneos/falsos · No contactable · Fuera del perfil comercial · Solicitud del prospecto · Otro.
  - Si en `/Lead/Cancela` el motivo elegido es "Otro", el campo `Especifica` es obligatorio.

  ---
  **Desarrollado por:** SIS10 - JASS
