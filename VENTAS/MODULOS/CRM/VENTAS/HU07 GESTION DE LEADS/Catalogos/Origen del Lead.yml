docs: |
  # Servicio REST — Catálogo Origen del Lead

  ---

  ## 1. Título del Servicio

  **Catálogo Origen del Lead (HU-07)**
  Devuelve el catálogo **Origen del Lead** (solo activos) para el combo "Origen" en Alta/Edición de Lead. Incluye el valor `Transferido TeleMarketing`.
  Programa servidor: `lead.p` · Procedimiento: `leeOrigenLead`.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Lead/OrigenLead
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  - **`IdUser`** · STRING · ✅ — Usuario que ejecuta. Vacío/nulo → `IdError=true` con "Se requiere el usuario (IdUser).".

  ---

  ## 5. Body

  No aplica. Método `GET`.

  ---

  ## 6. Headers

  | Header         | Valor                                  |
  |----------------|----------------------------------------|
  | `Accept`       | `application/json`                     |
  | `Content-Type` | `application/json` *(opcional en GET)* |

  ---

  ## 7. Ejemplo de Request

  ```
  GET http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Lead/OrigenLead?IdUser=jjlg
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Origenes de lead encontrados: 8.",
    "ttCatOrigen": [
      { "Id": 1, "Nombre": "Referido" },
      { "Id": 8, "Nombre": "Transferido TeleMarketing" }
    ]
  }
  ```

  ---

  ## 9. Campos de la Respuesta (ttCatOrigen)

  - **`Id`** · INTEGER — Clave del origen (`OrigenLead.Id-OrigenLead`).
  - **`Nombre`** · CHARACTER — Texto del origen para el combo.

  Campos de salida generales — **`IdError`** · BOOLEAN · **`Respuesta`** · CHARACTER.

  ---

  ## 10. Notas

  - Solo devuelve registros con `OrigenLead.Activo = TRUE`, ordenados por Id.
  - Este catálogo también es administrable vía `/Catalogo/Simple/*?Catalogo=OrigenLead`; aquí es solo lectura para el combo del Lead.

  ---
  **Desarrollado por:** SIS10 - JASS
