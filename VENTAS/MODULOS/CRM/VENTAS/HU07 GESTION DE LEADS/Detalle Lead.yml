docs: |
  # Servicio REST — Detalle del Lead

  ---

  ## 1. Título del Servicio

  **Detalle del Lead (HU-07)**
  Devuelve el encabezado del lead. Alimenta el modal Ver/Editar Lead.
  Programa servidor: `lead.p` · Procedimiento: `leeLead`.

  > **Nota:** el **timeline de actividades** (`LeadActividad`) se **omite por ahora** — la tabla no se dio de alta; se definirá cómo se alimentará (probablemente desde InConcert). Su `.txt` queda en `Docs/tablas-HU12/`.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Lead/Detalle
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **``IdUser``** · STRING · ✅ — Usuario que ejecuta.
  **``Folio``** · STRING · ✅ — Folio del lead a consultar (`LD-AAAA-####`).

  ---

  ## 5. Body

  No aplica. Método `GET`.

  ---

  ## 6. Headers

  | Header         | Valor                                  |
  |----------------|----------------------------------------|
  | `Accept`       | `application/json`                     |
  | `Content-Type` | `application/json`                     |

  ---

  ## 7. Ejemplo de Request

  ```
  GET http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Lead/Detalle?IdUser=jjlg&Folio=LD-2026-0007
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Detalle del lead LD-2026-0007.",
    "dsLeadDet": {
      "ttLeadDet": [
        { "Id": 12, "Folio": "LD-2026-0007", "Prospecto": "Juan Perez",
          "RazonSocial": "COMERCIAL DEL NORTE SA", "Correo": "jperez@cnorte.com",
          "Telefono": "8112345678", "IdOrigen": 1, "Origen": "Referido",
          "IdVendedor": "5197", "Vendedor": "JULIA LUCIO GARCIA",
          "FecAlta": "2026-08-20", "FecUltAct": "2026-08-21", "DiasSinSeg": 2,
          "Semaforo": "En Gestion", "Estatus": 2, "EstatusDescr": "En Proceso", "IdCliente": 0 }
      ]
    }
  }
  ```

  ---

  ## 9. Campos de la Respuesta

  **`ttLeadDet`** — mismos campos del grid (ver Consulta).

  > El `dsLeadDet` por ahora solo trae `ttLeadDet` (encabezado). El timeline de actividades queda pendiente (ver nota en §1).

  ---

  ## 10. Reglas y Validaciones

  - `IdUser` y `Folio` obligatorios.
  - Si el folio no existe → `IdError=true` con mensaje amigable.

  ---
  **Desarrollado por:** SIS10 - JASS
