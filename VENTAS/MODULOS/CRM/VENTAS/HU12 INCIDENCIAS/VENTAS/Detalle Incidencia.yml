docs: |
  # Servicio REST — Detalle de Incidencia

  ---

  ## 1. Título del Servicio

  **Detalle de Incidencia (HU-12)**
  Servicio **compartido** por Ventas y CEDIS para abrir el modal "Ver / Atender". A partir del folio devuelve, en un solo dataset: encabezado, artículos (problema/solución por renglón), causas raíz, checklist de actividades y los documentos adjuntos **en metadatos (sin el BLOB)**. El binario de cada documento se baja aparte con `/Incidencia/Documento`, para que esta consulta sea ligera.
  Programa servidor: `incdetalle.p` · Procedimiento: `leeIncidencia`.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Incidencia/Detalle
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  - **`IdUser`** · STRING · ✅ — Usuario que ejecuta la consulta
  - **`Folio`** · STRING · ✅ — Folio de la incidencia `INC-AAAA-NNNN`

  ---

  ## 5. Body

  No aplica. Método `GET`.

  ---

  ## 6. Headers

  | Header         | Valor                                  |
  |----------------|----------------------------------------|
  | `Accept`       | `application/json`                     |
  | `Content-Type` | `application/json` *(opcional en GET)* |

  ---

  ## 7. Ejemplo de Request

  ```
  GET .../Incidencia/Detalle?IdUser=jjlg&Folio=INC-2026-0034
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Incidencia INC-2026-0034 cargada.",
    "dsIncDetalle": {
      "ttIncEnc": [
        { "IdIncidencia": 34, "Folio": "INC-2026-0034", "Origen": "V",
          "FecReg": "2026-08-12", "IdPedido": "PED-458821", "IdCliente": 55921,
          "Cliente": "PAPELERA DEL NORTE SA", "Estatus": 2, "EstatusDescr": "En Proceso",
          "IdResponsable": "", "Responsable": "", "NotasAtencion": "",
          "CostoMerma": 1450.00, "CostoFlete": 0.00, "CostoCostos": 0.00, "CostoTotal": 1450.00,
          "NumGuia": "", "SLAClase": "WARN", "EnviaCorreoCte": false } ],
      "ttIncDet": [
        { "IdIncidencia": 34, "Renglon": 1, "IdArticulo": "044868", "Articulo": "PAPEL BOND CARTA",
          "Cantidad": 12, "Presentacion": "PIEZA", "IdProblema": 11, "DescProblema": "Material Dañado",
          "IdSolucion": 20, "DescSolucion": "Reposición de Material CON Recolección",
          "Flete": true, "Merma": true, "CostoMerma": 1450.00 } ],
      "ttIncCausa": [
        { "IdIncidencia": 34, "Renglon": 1, "IdCausaRaiz": 16, "CausaRaiz": "Daño por fábrica", "EsPreseleccion": true } ],
      "ttIncSeg": [
