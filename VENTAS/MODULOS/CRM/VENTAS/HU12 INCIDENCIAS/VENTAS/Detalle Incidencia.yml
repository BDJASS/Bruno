  ---

  ## 9. Campos de la Respuesta

  **ttIncEnc (encabezado)** — datos generales: `Folio`, `Origen` (V/C), `Id-Cliente`/`Cliente`/`RFC`/`Direccion`/`Sucursal`, `Id-Vendedor`/`Vendedor`, `ModoCaptura` (A/P), `Estatus`+`EstatusDescr`, `Id-Responsable`/`Responsable`, `Observaciones`, `NotasAtencion`, `NumGuia`, costos (`CostoMerma`/`CostoFlete`/`CostoCostos`/`CostoTotal`), `SLAClase`, `FecHoraReg`/`FecHoraProceso`/`FecHoraResol`/`FecHoraLimiteSLA`, `EnviaCorreoCte`.
  **ttIncDet (artículos)** · N por incidencia — `Renglon`, `IdArticulo`/`Articulo`, `Cantidad`, `Presentacion`, `IdProblema`/`DescProblema`, `IdSolucion`/`DescSolucion`, `Flete`, `Merma`, `CostoMerma`, `Comentario`.
  **ttIncCausa (causas raíz)** · N por renglón — `Renglon`, `IdCausaRaiz`/`CausaRaiz`, `EsPreseleccion`.
  **ttIncSeg (checklist de atención)** · 1 fila por actividad — `Renglon`, `IdSolucion`, `IdActividad`/`Actividad`, `Area`, `EstadoAct` (`P`=Pendiente · `C`=Completado · `N`=No aplica), `Comentario`.
  **ttIncDoc (documentos — METADATOS)** · N por incidencia — `IdDoc`, `Etapa` (`A`=alta · `R`=resolución), `Nombre`, `Extension`, `TipoMime`, `Tamano` (bytes), `FecReg`. **NO incluye el binario.**

  ---

  ## 10. Notas

  - El dataset viene anidado (`DATA-RELATION`): artículos, checklist y documentos cuelgan del encabezado por `Id-Incidencia`.
  - `ttIncDoc` trae sólo metadatos; para descargar un documento use `/Incidencia/Documento` con `IdDoc`.

  ---
