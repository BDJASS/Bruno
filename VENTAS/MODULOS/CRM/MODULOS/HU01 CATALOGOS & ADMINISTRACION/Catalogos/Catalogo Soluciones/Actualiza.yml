docs: |
  # Servicio REST — Actualización de Solución

  ---

  ## 1. Título del Servicio

  **Actualización del Catálogo Maestro de Soluciones (HU-01, 2.0)**
  Edita nombre, Flete/Merma, Acción y/o estado de una solución.
  Programa: `catsolucion.p` · Procedimiento: `actualizaSolucion`.

  ---

  ## 2. Método HTTP

  ```
  PUT
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Catalogo/Solucion/Actualiza
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`Id`** · INTEGER · ✅ — Id de la solución.
  **`Nombre`** · STRING · ✅ — Nuevo nombre. Obligatorio, sin duplicar.
  **`Flete`** · STRING · ✅ — `"true"`/`"false"`.
  **`Merma`** · STRING · ✅ — `"true"`/`"false"`.
  **`Activo`** · STRING · ✅ — Estado `"true"`/`"false"`.
  **`IdUser`** · STRING · ✅ — Usuario que edita.

  ---

  ## 5. Body

  No aplica — los parámetros viajan en el **Query String** (ver secciones 4 y 7).

  ---

  ## 6. Headers

  | Header         | Valor                                  |
  |----------------|----------------------------------------|
  | `Accept`       | `application/json`                     |
  | `Content-Type` | `application/json`                     |

  ---

  ## 7. Ejemplo de Request

  ```
  PUT http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Catalogo/Solucion/Actualiza?Id=20&Nombre=Reposicion con recoleccion&Flete=true&Merma=true&Activo=true&IdUser=olds
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Registro actualizado: 20 - Reposicion de Material CON Recoleccion."
  }
  ```

  ---

  ## 9. Campos de la Respuesta

  **`IdError`** · BOOLEAN — `true` si falló una validación o hubo error; `false` si la operación fue correcta.
  **`Respuesta`** · CHARACTER — Mensaje amigable de resultado (no expone verbos HTTP ni errores técnicos).

  ---

  ## 10. Reglas y Validaciones

  - **`IdUser` es obligatorio** en todos los endpoints; si viene vacío o nulo → `IdError = true` con `"Se requiere el usuario (IdUser)."`.
  - `Id` debe existir.
  - `Nombre` sin duplicar.
  - `EXCLUSIVE-LOCK NO-WAIT`.
  - Toda Alta / Actualización / Baja registra auditoría (`programas/auditoria.p`, app `oeVentas`).
  - Ante cualquier fallo la respuesta es amigable y `IdError = true`; nunca se realiza la operación a medias (transacción con `UNDO`).

  ---
  **Desarrollado por:** SIS10 - JASS
