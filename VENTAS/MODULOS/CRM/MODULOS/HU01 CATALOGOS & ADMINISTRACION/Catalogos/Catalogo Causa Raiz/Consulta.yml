docs: |
  # Servicio REST — Consulta de Causas Raíz

  ---

  ## 1. Título del Servicio

  **Consulta del Catálogo de Causas Raíz (HU-01, 3.0)**
  Lista las causas raíz. `Estatus` se **expone como lógico** (`true` = Activo · `false` = Inactivo) aunque en la BD se guarde como entero (1/0).
  Programa: `catcausaraiz.p` · Procedimiento: `leeCausaRaiz`.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Catalogo/CausaRaiz/Consulta
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`Busqueda`** · STRING · ❌ — Texto parcial sobre el Nombre. Vacío = todas.
  **`IdUser`** · STRING · ✅ — Usuario que consulta.

  ---

  ## 5. Body

  No aplica. Método `GET`.

  ---

  ## 6. Headers

  | Header         | Valor                                  |
  |----------------|----------------------------------------|
  | `Accept`       | `application/json`                     |
  | `Content-Type` | `application/json` *(opcional en GET)* |

  ---

  ## 7. Ejemplo de Request

  ```
  GET .../Catalogo/CausaRaiz/Consulta?Busqueda=&IdUser=olds
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Consulta ejecutada correctamente.",
    "ttCausa": [
      { "Id": 16, "Nombre": "Dano por fabrica", "Estatus": true, "Uso": 3 },
      { "Id": 29, "Nombre": "No identificado", "Estatus": false, "Uso": 1 }
    ]
  }
  ```

  ---

  ## 9. Campos de la Respuesta

  **`ttCausa`** — arreglo de causas raíz:
  **`Id`** · INTEGER — Clave (CR-999).
  **`Nombre`** · CHARACTER — Descripción (puede ser multilínea).
  **`Estatus`** · BOOLEAN — `true` = Activo · `false` = Inactivo (en BD es entero 1/0).
  **`Uso`** · INTEGER — Nº de categorías de problema que la usan (`ProblemaCausa`).

  **`IdError`** · BOOLEAN — `true` si falló una validación o hubo error; `false` si la operación fue correcta.
  **`Respuesta`** · CHARACTER — Mensaje amigable de resultado (no expone verbos HTTP ni errores técnicos).

  ---

  ## 10. Reglas y Validaciones

  - **`IdUser` es obligatorio** en todos los endpoints; si viene vacío o nulo → `IdError = true` con `"Se requiere el usuario (IdUser)."`.
  - Ordenada por Nombre.
  - Ante cualquier fallo la respuesta es amigable y `IdError = true`; nunca se realiza la operación a medias (transacción con `UNDO`).

  ---
  **Desarrollado por:** SIS10 - JASS
