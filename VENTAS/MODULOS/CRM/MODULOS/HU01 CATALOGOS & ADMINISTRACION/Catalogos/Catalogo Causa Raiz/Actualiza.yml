docs: |
  # Servicio REST — Actualización de Causa Raíz

  ---

  ## 1. Título del Servicio

  **Actualización del Catálogo de Causas Raíz (HU-01, 3.0)**
  Edita el nombre y/o el estatus de una causa raíz.
  Programa: `catcausaraiz.p` · Procedimiento: `actualizaCausaRaiz`.

  ---

  ## 2. Método HTTP

  ```
  PUT
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Catalogo/CausaRaiz/Actualiza
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`Id`** · INTEGER · ✅ — Id de la causa raíz.
  **`Nombre`** · STRING · ✅ — Nueva descripción. Obligatoria, sin duplicar.
  **`Estatus`** · BOOLEAN · ❌ — `true` = Activo · `false` = Inactivo. **Si no se envía, se conserva** el valor actual (se guarda como entero 1/0).
  **`IdUser`** · STRING · ✅ — Usuario que edita.

  ---

  ## 5. Body

  No aplica — los parámetros viajan en el **Query String** (ver secciones 4 y 7).

  ---

  ## 6. Headers

  | Header         | Valor                                  |
  |----------------|----------------------------------------|
  | `Accept`       | `application/json`                     |
  | `Content-Type` | `application/json`                     |

  ---

  ## 7. Ejemplo de Request

  ```
  PUT http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Catalogo/CausaRaiz/Actualiza?Id=3&Nombre=Error de captura&Estatus=true&IdUser=olds
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Registro actualizado: 30 - Error de etiquetado en origen."
  }
  ```

  ---

  ## 9. Campos de la Respuesta

  **`IdError`** · BOOLEAN — `true` si falló una validación o hubo error; `false` si la operación fue correcta.
  **`Respuesta`** · CHARACTER — Mensaje amigable de resultado (no expone verbos HTTP ni errores técnicos).

  ---

  ## 10. Reglas y Validaciones

  - **`IdUser` es obligatorio** en todos los endpoints; si viene vacío o nulo → `IdError = true` con `"Se requiere el usuario (IdUser)."`.
  - `Id` debe existir.
  - `Nombre` sin duplicar contra otra causa.
  - `Estatus` (lógico) solo se aplica si viene; si no, se conserva. Se guarda como entero (`true→1`, `false→0`).
  - `EXCLUSIVE-LOCK NO-WAIT`.
  - Toda Alta / Actualización / Baja registra auditoría (`programas/auditoria.p`, app `oeVentas`).
  - Ante cualquier fallo la respuesta es amigable y `IdError = true`; nunca se realiza la operación a medias (transacción con `UNDO`).

  ---
  **Desarrollado por:** SIS10 - JASS
