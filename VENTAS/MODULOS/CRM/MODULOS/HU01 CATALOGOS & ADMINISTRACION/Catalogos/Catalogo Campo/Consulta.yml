docs: |
  # Servicio REST — Consulta de Campos del Ticket

  ---

  ## 1. Título del Servicio

  **Consulta del Catálogo de Campos del ticket (HU-01, 4.0)**
  Lista los campos de formulario que una solución puede habilitar. El valor capturado en la incidencia se guarda como texto. Devuelve además el conteo de uso (`Uso`) de cada campo.
  Programa: `catcampo.p` · Procedimiento: `leeCampo`.

  ---

  ## 2. Método HTTP

  ```
  GET
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Catalogo/Campo/Consulta
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`Busqueda`** · STRING · ❌ — Texto parcial sobre el Nombre. Vacío = todos.
  **`IdUser`** · STRING · ✅ — Usuario que consulta.

  ---

  ## 5. Body

  No aplica. Método `GET`.

  ---

  ## 6. Headers

  | Header         | Valor                                  |
  |----------------|----------------------------------------|
  | `Accept`       | `application/json`                     |
  | `Content-Type` | `application/json` *(opcional en GET)* |

  ---

  ## 7. Ejemplo de Request

  ```
  GET .../Catalogo/Campo/Consulta?Busqueda=&IdUser=olds
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "IdError": false,
    "Respuesta": "Consulta ejecutada correctamente.",
    "ttCampo": [
      { "Id": 1, "Nombre": "Cuantos Bultos", "Activo": true, "Uso": 2 },
      { "Id": 9, "Nombre": "Material Recibido", "Activo": true, "Uso": 1 }
    ]
  }
  ```

  ---

  ## 9. Campos de la Respuesta

  **`ttCampo`** — arreglo de campos:
  **`Id`** · INTEGER — Clave (CAMPO-999).
  **`Nombre`** · CHARACTER — Nombre del campo del formulario.
  **`Activo`** · BOOLEAN — Estado.
  **`Uso`** · INTEGER — Nº de soluciones que lo habilitan (`SolucionCampo`).

  **`IdError`** · BOOLEAN — `true` si falló una validación o hubo error; `false` si la operación fue correcta.
  **`Respuesta`** · CHARACTER — Mensaje amigable de resultado (no expone verbos HTTP ni errores técnicos).

  ---

  ## 10. Reglas y Validaciones

  - **`IdUser` es obligatorio** en todos los endpoints; si viene vacío o nulo → `IdError = true` con `"Se requiere el usuario (IdUser)."`.
  - Ordenado por Nombre.
  - Ante cualquier fallo la respuesta es amigable y `IdError = true`; nunca se realiza la operación a medias (transacción con `UNDO`).

  ---
  **Desarrollado por:** SIS10 - JASS
