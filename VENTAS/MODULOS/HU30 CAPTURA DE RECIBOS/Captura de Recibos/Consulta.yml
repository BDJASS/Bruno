docs: |
  # Servicio REST — Recibos: Consulta de Pedidos para Captura

  ---

  ## 1. Título del Servicio

  **Captura de Recibos — Consulta (HU30)**
  Regresa los **pedidos EnFirme** de un cliente que coinciden con una **requisición de cliente** (query `ReqCte`), con su **IR / Recibo del cliente** (`IRdelCte`), requisición, fecha y subtotal, para armar la pantalla de captura.
  Programa servidor: `vtaa0130.p` · Procedimiento: `consultaRecibos` (GET) | Versión REST de `vtaa0130.p` (modo carácter). Módulo `/Ventas/Pedidos/`.

  > La captura/guardado se hace con el endpoint `POST /Ventas/Pedidos/Recibos/Actualiza` (ver [vtaa0130-ActualizaRecibos.md](vtaa0130-ActualizaRecibos.md)).

  ---

  ## 2. Método HTTP y URL

  ```
  GET http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Ventas/Pedidos/Recibos/Consulta
  ```

  ---

  ## 3. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`IdCliente`** · STRING · ✅ — Folio del cliente (numérico; `0` o inexistente = error)
  **`ReqCte`** · STRING · ❌ — Requisición del cliente a buscar. Vacío = pedidos **sin requisición** capturada aún
  **`IdUser`** · STRING · ✅ — Usuario que consulta (auditoría e insumo de bitácora futura)

  ---

  ## 4. Ejemplo de Request

  ```
  GET .../Ventas/Pedidos/Recibos/Consulta?IdCliente=45210&ReqCte=OC-8891&IdUser=olds
  ```

  Buscar pedidos sin requisición capturada:

  ```
  GET .../Ventas/Pedidos/Recibos/Consulta?IdCliente=45210&ReqCte=&IdUser=olds
  ```

  ---

  ## 5. Campos del Response (`ttRecibo`, por pedido)

  Un renglón por pedido EnFirme que coincide con el cliente + requisición:

  **`IdPedido`** · STRING — Folio del pedido
  **`Resto`** · INTEGER — Resto del pedido
  **`FecReg`** · DATE — Fecha de registro del pedido
  **`IRdelCte`** · STRING — IR / Recibo del cliente actual (editable en la captura)
  **`Requisicion`** · STRING — Requisición del cliente actual (editable en la captura)
  **`Subtotal`** · DECIMAL — Subtotal del pedido
  **`IdCliente`** · INTEGER — Folio del cliente
  **`RazonSocial`** · STRING — Razón social del cliente

  > `ttRecibo` es una tabla **independiente** de la del POST: trae **solo** los datos que se muestran en la captura. Los campos de captura (`IdUser`) y el resultado viven en el POST, no aquí.

  **`Respuesta`** — mensaje simple: en éxito `"Consulta ejecutada correctamente."`; si no hay pedidos `"No se encontraron pedidos para la requisicion indicada."` (con `IdError = false` y `ttRecibo` vacío); en error, el texto del problema.

  ---

  ## 6. Validaciones (mensajes exactos)

  **`"Se requiere el usuario (IdUser)."`** — `IdUser` vacío
  **`"Cliente inexistente, verifique."`** — `IdCliente` = `0`, no numérico o sin registro en `Cliente`
  **`"No existe la requisicion para el cliente indicado, verifique."`** — no hay ningún pedido (firme o no) con ese cliente + requisición
  **`"No se encontraron pedidos para la requisicion indicada."`** — la requisición existe pero ninguno de sus pedidos está EnFirme (`IdError = false`, `ttRecibo` vacío)
  **`"Consulta ejecutada correctamente."`** — hay pedidos EnFirme para capturar

  ---

  ## 7. Auditoría (`programas/auditoria.p`)

  **Area** = `oeVentas` · **Modulo** = `Pedidos` · **Programa** = `vtaa0130`
  **Operacion** = `GET` · **Resource** = `/Ventas/Pedidos/Recibos/Consulta`
  **Respuesta** = el texto de `Respuesta` devuelto

  ---

  ## 8. Plan de Pruebas

  | # | Caso | Esperado |
  |---|------|----------|
  | C1 | GET sin `IdUser` | `"Se requiere el usuario (IdUser)."` |
  | C2 | GET con `IdCliente=0` o inexistente | `"Cliente inexistente, verifique."` |
  | C3 | GET con requisición que no existe para el cliente | `"No existe la requisicion para el cliente indicado, verifique."` |
  | C4 | GET con requisición existente pero sin pedidos en firme | `IdError=false`, `ttRecibo` vacío, `"No se encontraron pedidos para la requisicion indicada."` |
  | C5 | GET válido | `IdError=false`, `"Consulta ejecutada correctamente."`, `ttRecibo` con un renglón por pedido EnFirme |

  ---

  ## 9. Registro en el resourceModel

  Recurso `_Ventas_Pedidos_Recibos_Consulta`, path `/Ventas/Pedidos/Recibos/Consulta`, verbo **GET**, operación `vtaa0130..consultaRecibos`. Binding en `vtaa0130.pidl` (parámetros query `IdCliente`, `ReqCte`, `IdUser`).

  ---

  ## 10. Resultado

  | Estado              | Descripción                                                  |
  |---------------------|--------------------------------------------------------------|
