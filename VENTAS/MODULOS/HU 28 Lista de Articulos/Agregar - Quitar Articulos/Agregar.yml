docs: |
  # Servicio REST — Listas de Artículos (Agregar Artículos)

  ---

  ## 1. Título del Servicio

  **Listas de Artículos — Agregar Artículos**
  Agrega uno o varios artículos (separados por coma) a una lista, con las mismas validaciones que la pantalla: artículo existente en el catálogo y no repetido en la lista.
  Programa servidor: `listaart.p` · Procedimiento: `agregaArticulos` | Versión REST del alta de artículos de `cnfa0810.p` / `cnfa0810.i` (modo carácter).

  ---

  ## 2. Método HTTP

  ```
  POST
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Ventas/ListaArticulos/AgregaArticulos
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`IdLista`** · STRING · ✅ — Número de la lista; debe existir en `ListaArt`
  **`IdArticulos`** · STRING · ✅ — Clave(s) de artículo separadas por coma
  - Las claves numéricas se completan con ceros a la izquierda a 6 posiciones (ej. `1234` → `001234`)
  - Ej: `001234` · `1234,4567,7890`

  **`IdUser`** · STRING · ✅ — Usuario que realiza el alta (queda en la auditoría)

  ---

  ## 5. Body

  No aplica.

  ---

  ## 6. Headers

  | Header         | Valor              |
  |----------------|--------------------|
  | `Accept`       | `application/json` |
  | `Content-Type` | `application/json` |

  ---

  ## 7. Ejemplo de Request

  ```
  POST .../Ventas/ListaArticulos/AgregaArticulos?IdLista=13&IdArticulos=1234,4567&IdUser=sis10
  ```

  ---

  ## 8. Ejemplo de Response

  ```json
  {
    "response": {
      "IdError": false,
      "Respuesta": "Lista 13: 2 articulo(s) agregado(s)."
    }
  }
  ```

  ### Response parcial (algunos artículos no procesados)

  ```json
  {
    "response": {
      "IdError": false,
      "Respuesta": "Lista 13: 1 articulo(s) agregado(s). No procesados: 999999: el articulo no existe. 001234: ya existe en la lista."
    }
  }
  ```

  ---

  ## 9. Validaciones del Servicio

  | Caso | Comportamiento |
  |------|----------------|
  | `IdUser` vacío | `IdError: true` — `"Se requiere el usuario (IdUser)."` |
  | `IdLista` vacío, no numérico o `≤ 0` | `IdError: true` — `"Numero de lista invalido."` |
  | Lista inexistente | `IdError: true` — `"Lista de articulos inexistente."` |
  | `IdArticulos` vacío | `IdError: true` — `"Se requiere al menos un articulo (IdArticulos)."` |
  | Artículo inexistente | Se omite y se reporta: `"<clave>: el articulo no existe."` |
  | Artículo ya en la lista | Se omite y se reporta: `"<clave>: ya existe en la lista."` |
  | Ningún artículo procesado | `IdError: true` + detalle de fallas |
  | Al menos un artículo agregado | `IdError: false` + total agregados y detalle de omitidos |

  ---

  ## 10. Evidencia de Ejecución

  *Pendiente de captura por parte del equipo de QA.*

  ---

  ## 11. Fecha de Prueba

  | Ambiente | Fecha      | Ejecutado por |
  |----------|------------|---------------|
  | DEV      | *(pendiente)* | *(pendiente)* |

  ---

  ## 12. Resultado

  | Estado              | Descripción                                                  |
  |---------------------|--------------------------------------------------------------|
  | ⏳ Pendiente prueba | Servicio desarrollado. Pendiente de compilación/deploy y QA. |

  ---

  ## 13. Observaciones Técnicas

  1. **Procesamiento por artículo:** cada clave se valida y graba por separado (la pantalla original es captura uno a uno); los válidos se agregan aunque otros fallen. `IdError: true` solo cuando **ninguno** procede.
  2. **Normalización:** mismo criterio que `cnfa0001.i` picture `'999999'` — claves numéricas se rellenan con ceros a 6 posiciones; claves alfanuméricas se usan tal cual.
  3. **Idempotencia:** reintentar el mismo alta reporta los artículos como `"ya existe en la lista"` sin duplicarlos.
  4. **Auditoría:** operación `AGREGA-ART` en `programas/auditoria.p` (módulo `ListaArticulos`), no crítica; solo se registra si se agregó al menos un artículo.
  5. **Autenticación:** servicio sobre OpenEdge PASOE; si el ambiente requiere Bearer, incluir `Authorization: Bearer <token>`.

  ---
  **Desarrollado por:** SIS10 - JASS
