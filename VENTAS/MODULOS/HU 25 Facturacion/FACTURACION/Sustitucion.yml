docs: |
  # Servicio REST — Factura de Contado (Sustitución / Cambio de Información)

  ---

  ## 1. Título del Servicio

  **Factura de Contado — Sustitución / Cambio de Información**
  Aplica cambios a los datos generales de una factura de contado con las mismas validaciones y efectos que la pantalla original:
  - **Con UUID (ya timbrada):** genera un folio nuevo, crea la factura sustituta (CFDI 4.0 con relación de sustitución `SustUUID` / `SustIdRemision`), copia el detalle, reapunta los documentos ligados (`Pedido`, `EstPedido`, `Movim`, `MovCaja`, `Vale`, `Devolucion`), timbra la nueva (`vtac2070.p`), cancela la original (`FecCancel` + `PorUUID`/`PorIdRemision`) y solicita su cancelación fiscal (`vtac2072.p`).
  - **Sin UUID:** actualiza la misma factura y solicita su folio electrónico (`vtac2070.p`).

  Programa servidor: `facturasust.p` · Procedimiento: `sustituyeFactura` | Versión REST de `vtaa0190.p` (modo carácter).

  ---

  ## 2. Método HTTP

  ```
  POST
  ```

  ---

  ## 3. URL Completa

  ```
  http://192.0.1.14:8853/RestADOSAVentas/rest/RestADOSAVentas/Ventas/FacturaContado/Sustituye
  ```

  ---

  ## 4. Parámetros de Entrada (Query String)

  > ✅ = Requerido · ❌ = Opcional

  **`IdUser`** · STRING · ✅ — Usuario que aplica el cambio. Debe existir en `Usuario`; su `Id-Ubicacion` define la serie de folios, igual que `g-Origen` en modo carácter
  - Ej: `"sis10"`

  ---

  ## 5. Body

  JSON con el **mismo registro que regresa el GET** `/Ventas/FacturaContado/Consulta`, ya editado. `ttFactura` es idéntico en ambos endpoints y el usuario viaja en el query string (ver sección 4).

  **`ForzarFiscal`** · BOOLEAN · ❌ — *(Ticket 3836)* Fuerza el proceso de **datos fiscales** sin revisar si hubo cambios
  - `true` → no se valida *"sin cambios"* ni se toma la rama de *solo embarque*. **Con UUID:** folio nuevo + timbra la nueva + cancela la original (sustitución completa). **Sin UUID:** actualiza la misma factura y solicita el folio electrónico
  - `false` / omitido / `null` → comportamiento normal: se clasifica por lo que cambió (fiscal → sustitución/re-timbrado; solo embarque → mismo folio; nada → error *"sin cambios"*)
  - El GET lo regresa en `false`. Todas las validaciones (RFC/SAT, régimen, CP, catálogos, ventana de fechas, bloqueos) aplican igual

  ```json
  {
    "request": {
      "ttFactura": {
        "ttFactura": [
          {
            "IdRemision": "12345AB",
            "IdVendedor": "0021",
            "IdCliente": 34561,
            "RazonSocial": "PAPELERA DEL NORTE SA DE CV",
            "RFC": "PNO910101AB1",
            "NomEmpresa": "PAPELERA DEL NORTE",
            "RSocietario": "SA DE CV",
            "IdRFiscal": "601",
            "CalleNo": "AV JUAREZ 100",
            "Colonia": "CENTRO",
            "IdCiudad": 1,
            "CP": "64000",
            "RazonSocial1": "PAPELERA DEL NORTE SA DE CV",
            "Email": "compras@papeleranorte.mx",
            "CalleNo1": "AV JUAREZ 100",
            "Colonia1": "CENTRO",
            "Ciudad1": "MONTERREY",
            "Estado1": "NUEVO LEON",
            "CP1": "64000",
            "Referencia": "",
            "Attn": "LUIS GARZA",
            "IdEntrega": 3,
            "IdTran": 0,
            "Observaciones1": "",
            "Observaciones2": "",
            "Requisicion": "",
            "FEFormaPago": "03",
            "IdUsoCFDI": "G03",
            "ForzarFiscal": false
          }
        ]
      }
    }
  }
  ```

  > Los campos informativos (`NombreVendedor`, `DescrRFiscal`, `NombreCiudad`, `TieneUUID`, etc.) pueden viajar como los regresó el GET; el servicio los ignora como entrada y los recalcula en la salida.

  ---

  ## 6. Headers

  | Header         | Valor              |
  |----------------|--------------------|
  | `Accept`       | `application/json` |
  | `Content-Type` | `application/json` |

  ---

  ## 7. Ejemplo de Request

  ```
  POST .../Ventas/FacturaContado/Sustituye?IdUser=sis10
       (con el registro ttFactura en el body)
  ```

  ---

  ## 8. Ejemplo de Response

  ### Sustitución (factura con UUID)

  ```json
  {
    "response": {
      "IdError": false,
      "Respuesta": "Se ha sustituido la factura 12345AB por el folio 00871AC correctamente.",
      "ttFactura": {
        "ttFactura": [
          {
            "IdRemision": "00871AC",
            "FecReg": "2026-07-11",
            "UUID": "BBBB2222-CCCC-3333-DDDD-444455556666",
            "TieneUUID": true,
            "SustIdRemision": "12345AB",
            "...": "resto de campos con los valores aplicados"
          }
        ]
      }
    }
  }
  ```

  ### Actualización (factura sin UUID)

  ```json
  {
    "response": {
      "IdError": false,
      "Respuesta": "Se actualizo la factura 12345AB y se solicito el folio electronico correctamente."
    }
  }
  ```

  ---

  ## 9. Campos capturables vs. no capturables

  Tomado del `SET` del frame `f-Remision` de `vtaa0190.p` (modo carácter): lo que está en el `SET` es lo que el usuario captura; lo que solo se `DISPLAY` es de lectura.

  ### ✏️ Capturables por el usuario (27 campos)

  **Vendedor y cliente** (tienen catálogo)
  **`IdVendedor`** · STRING — Catálogo `Vendedor`. Se completa con ceros a 4 posiciones
  **`IdCliente`** · INT — Catálogo `Cliente`. **Al cambiarlo se disparan 9 autollenados** → llamar `GET /Ventas/FacturaContado/DatosCliente` (ver sección 10)

  **Datos fiscales del receptor** — capturables **solo** en venta mostrador (`IdCliente = 3`); con cualquier otro cliente se autollenan y van de solo lectura
  **`RFC`** · STRING — Se valida estructura + inscripción ante el SAT. **Al cambiarlo la pantalla autollena desde `CteSReg`** (ver sección 10)
  **`RazonSocial`** · STRING
  **`NomEmpresa`** · STRING
  **`RSocietario`** · STRING
  **`IdRFiscal`** · STRING — Catálogo `RFiscal`; se valida compatibilidad con el tipo de contribuyente
  **`CalleNo`** · STRING
  **`Colonia`** · STRING
  **`IdCiudad`** · INT — Catálogo `Ciudad`
  **`CP`** · STRING — 5 dígitos numéricos

  **Datos de embarque** — siempre capturables (no dependen del cliente)
  **`RazonSocial1`** · STRING — "Embarcar a"
  **`CalleNo1`** · STRING
  **`Colonia1`** · STRING
  **`Ciudad1`** · STRING — Texto libre, **no** es catálogo
  **`Estado1`** · STRING — Texto libre, **no** es catálogo
  **`CP1`** · STRING — Sin validación de 5 dígitos (esa solo aplica al CP fiscal)

  **Contacto y logística** — siempre capturables
  **`Email`** · STRING
  **`Attn`** · STRING — Contacto
  **`Referencia`** · STRING
  **`IdEntrega`** · INT — Catálogo `Entrega` (debe estar activo). Si es `≤ 11` o `= 16` (entrega local), el servicio **fuerza `IdTran = 0`**
  **`IdTran`** · INT — Catálogo `Transporte`; solo se exige en entregas foráneas
  **`Observaciones1`** · STRING
  **`Observaciones2`** · STRING
  **`Requisicion`** · STRING — Requisición del cliente
  **`FEFormaPago`** · STRING — Solo `01,02,03,04,28,99`
  **`IdUsoCFDI`** · STRING — Catálogo `UsoCFDI`. **No** se autollena del cliente (ver sección 10)

  ### 🔒 No capturables

  **`IdRemision`** — Identifica la factura; en la sustitución el servicio genera el folio nuevo
  **`FecReg`** — Solo `DISPLAY` en la pantalla; en la sustitución queda `TODAY`
  **`TieneUUID`, `UUID`, `SustIdRemision`** — Los administra el servicio (timbrado y relación de sustitución)
  **`NombreVendedor`, `DescrRFiscal`, `NombreCiudad`, `NombreEstado`, `DescrEntrega`, `NombreTransporte`, `DescrFormaPago`** — Descripciones de catálogo, informativas. Pueden viajar en el body: el servicio **las ignora** como entrada y las recalcula

  ---

  ## 10. Autollenados al cambiar cliente o RFC

  ### Al cambiar `IdCliente` (≠ 3)

  La pantalla copia **9 campos** del catálogo `Cliente` y **brinca el cursor** a `RazonSocial1`, es decir el usuario no los edita:

  `RazonSocial` · `RFC` · `NomEmpresa` · `RSocietario` · `IdRFiscal` · `CalleNo` · `Colonia` · `IdCiudad` · `CP`

  👉 Usar **`GET /Ventas/FacturaContado/DatosCliente?IdCliente=&IdUser=`** para obtenerlos y dejarlos de solo lectura. Ver `facturasust-FacturaContadoDatosCliente.md`.

  Con `IdCliente = 3` (venta mostrador) **no** hay autollenado: esos 9 campos se capturan a mano.

  ### Al cambiar `RFC`

  La pantalla busca `FIND LAST CteSReg WHERE CteSReg.RFC = <nuevo>`; si existe copia `RazonSocial`, `NomEmpresa`, `RSocietario`, `RFC`, `CalleNo`, `Colonia`, `IdCiudad` y **deja el `CP` en blanco** para que se capture. Hoy este autollenado **no** tiene endpoint; queda del lado del front o se puede exponer como servicio gemelo.

  ### `IdUsoCFDI` — ojo

  El catálogo `Cliente` **sí** tiene `Id-UsoCFDI` (campo 1140), pero la pantalla **no lo copia** al cambiar cliente: la factura conserva el que traía y el usuario lo captura. El servicio replica ese comportamiento.

  ---

  ## 11. Validaciones del Servicio

  | Caso | Comportamiento |
  |------|----------------|
  | `IdUser` vacío (query string) | `"Se requiere el usuario (IdUser)."` — se valida **antes** del body |
  | Body vacío | `"No se recibieron datos de la factura."` |
  | `IdUser` no existe en `Usuario` | `"Usuario inexistente (IdUser)."` |
  | Factura inexistente / no contado / cancelada | `"Factura de contado inexistente, verifique..."` |
  | Factura fuera de ventana de fechas | `"Solo se pueden modificar facturas de un anio anterior hasta el 31 de Marzo del anio actual..."` |
  | Vendedor inexistente | `"Folio de vendedor inexistente, verifique..."` |
  | Cliente inexistente (excepto cuenta `3`) | `"Folio de cliente inexistente, verifique..."` |
  | RFC < 12 caracteres | `"RFC incorrecto, no puede tener menos de 12 caracteres, favor de verificar..."` |
  | RFC con estructura inválida (caracteres/fecha) | `"RFC incorrecto, favor de verificar..."` |
  | RFC no inscrito en el SAT (`sisd0002.p`) | `"El SAT informa que el RFC ingresado no existe en sus registros..."` |
  | Régimen fiscal inexistente | `"Folio de regimen fiscal inexistente, favor de verificar."` |
  | Régimen incompatible (física 13 chars: `601,603,620` · moral 12 chars: `605,612,616`) | `"Regimen fiscal no compatible con contribuyente, favor de verificar..."` |
  | Ciudad inexistente | `"Folio de ciudad inexistente, verifique..."` |
  | CP ≠ 5 dígitos | `"Longitud incorrecta de la captura del CP"` / `"Solo debe capturar digitos entre 0 y 9..."` |
  | Entrega inexistente o inactiva | `"Folio de entrega inexistente, verifique..."` |
  | Transporte inexistente (entregas foráneas) | `"Folio de transporte inexistente, verifique..."` |
  | Forma de pago fuera de `01,02,03,04,28,99` | `"Forma de pago invalida, verifique valores..."` |
  | Uso CFDI inexistente | `"Uso de CFDI incorrecto, favor de verificar..."` |
  | Sin ningún cambio y con UUID (`ForzarFiscal` ≠ `true`) | `"No se ha generado ningun cambio en la factura, no se generara ningun folio nuevo."` |
  | Sin ningún cambio y `ForzarFiscal: true` | **Pasa**: entra al proceso fiscal (sustitución con UUID / re-timbrado sin UUID) |
  | PAC regresa error al timbrar (rama sin UUID) | `IdError: true`, pero **el cambio queda grabado** — `"...el PAC regreso error al timbrar; revise el archivo ... y reintente."` |

  Reglas automáticas (igual que la pantalla):
  - `IdVendedor` se completa con ceros a la izquierda a 4 posiciones.
  - `RFC`, razón social, domicilios, contacto, forma de pago y uso CFDI se convierten a mayúsculas; al RFC se le quitan espacios.
  - Si `IdEntrega ≤ 11` o `= 16` (entrega local), `IdTran` se fuerza a `0`.
  - El RFC genérico (`XAXX010101000` / `XEXX010101000`) queda exento de la validación de compatibilidad de régimen.

  ---

  ## 12. Evidencia de Ejecución

  *Pendiente de captura por parte del equipo de QA.*

  ---

  ## 13. Fecha de Prueba

  | Ambiente | Fecha      | Ejecutado por |
  |----------|------------|---------------|
  | DEV      | *(pendiente)* | *(pendiente)* |

  ---

  ## 14. Resultado

  | Estado              | Descripción                                                       |
  |---------------------|-------------------------------------------------------------------|
