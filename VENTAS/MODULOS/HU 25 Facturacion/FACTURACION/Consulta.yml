  ## 15. Observaciones Técnicas

  1. **Origen:** versión REST de la fase de consulta de `vtaa0190.p` (modo carácter). El registro que regresa es el mismo que se manda de vuelta (editado) al POST `/Ventas/FacturaContado/Sustituye`.
  2. **Confirmación de factura timbrada:** el servicio replica la ventana del modo carácter *"La factura … ya cuenta con folio electronico, al realizar una modificacion se generara un nuevo folio electronico. ¿Desea continuar?"*. El servidor la impone: sin `Confirmar=true` **no** entrega el registro, así que el front no puede entrar a editar una factura timbrada sin que el usuario acepte. `TieneUUID` sigue viniendo en el registro para que el front mantenga el aviso visible durante la edición.
  3. **Autollenados de la pantalla** (al cambiar cliente se copian los datos fiscales del catálogo `Cliente`; al cambiar RFC se buscan datos en `CteSReg`): son responsabilidad del front; este servicio valida los datos finales.
  4. **Flujo completo:** ver documento `facturasust-FacturaContadoSustituye.md`.
  5. **Autenticación:** servicio sobre OpenEdge PASOE; si el ambiente requiere Bearer, incluir `Authorization: Bearer <token>`.

