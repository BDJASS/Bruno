  ---

  ## 14. Observaciones Técnicas

  1. **Origen:** ayuda F2 `vtaf0290.p`, construida con el include `seeksoft.i` sobre un temp-table armado en memoria (no sobre tabla de base de datos).
  2. **Sin el ciclo `1..99`:** el carácter recorre 99 iteraciones con un `CASE` que solo atiende 6 casos. Aquí se declaran los 6 directo — mismo resultado, sin las 93 iteraciones inútiles.
  3. **Entrada comentada en el original:** `vtaf0290.p` tiene comentada una opción `"NA" / "NO DEFINIDO"`. **No** se incluye, para conservar el comportamiento vigente (y porque `NA` no es un código válido del SAT).
  4. **Claves como texto:** `FEFormaPago` es `CHARACTER` de 2 posiciones con cero a la izquierda. El front debe mandarlas como string (`"01"`, no `1`), igual que las espera la validación del guardado.
  5. **Sin estado:** el servicio no lee base de datos ni escribe nada; construye el temp-table en memoria.
  6. **Autenticación:** servicio sobre OpenEdge PASOE; si el ambiente requiere Bearer, incluir `Authorization: Bearer <token>`.

  ---
  **Desarrollado por:** SIS10 - JASS
