  ---

  ## 15. Observaciones Técnicas

  1. **Origen exacto:** bloque `IF FRAME-FIELD = "Id-Cliente"` de `vtaa0190.p`. La pantalla hace el `ASSIGN` de los 9 campos y luego `NEXT-PROMPT ttRemision.RazonSocial1`, o sea **brinca el cursor** sobre los campos autollenados: de ahí que no sean editables.
  2. **Solo lectura:** el servicio no escribe nada; es un `FIND` a `Cliente` más 3 lecturas de catálogo.
  3. **Segundo autollenado, por RFC (no implementado aquí):** la pantalla también autollena al cambiar el **RFC**, buscando `FIND LAST CteSReg WHERE CteSReg.RFC = <nuevo>`; si existe copia `RazonSocial`, `NomEmpresa`, `RSocietario`, `RFC`, `CalleNo`, `Colonia`, `Id-Ciudad` y **limpia el `CP`**. Si se requiere, se puede exponer como un endpoint gemelo (`.../DatosRFC?RFC=`).
  4. **Autenticación:** servicio sobre OpenEdge PASOE; si el ambiente requiere Bearer, incluir `Authorization: Bearer <token>`.

