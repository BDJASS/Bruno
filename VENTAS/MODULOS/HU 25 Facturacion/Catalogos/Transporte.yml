  ---

  ## 14. Observaciones Técnicas

  1. **Origen:** ayudas F2 `vtaf0020.p` (orden por `Id-Tran`, índice `idx-tran`) y `vtaf0021.p` (orden por `Nombre`, índice `Idx-Nombre`), ambas construidas con el include `seeksoft.i`. Las dos se consolidan en un solo endpoint con el parámetro `OrdenarPor`.
  2. **Sin filtro de vigencia:** la tabla `Transporte` **no tiene campo `Activo`** — la ayuda del carácter usa `&Where = TRUE` y trae todos los registros. El servicio conserva ese comportamiento. Si el negocio requiere dar de baja transportistas, hay que agregar el campo al diccionario y filtrarlo aquí (no se asume).
  3. **Búsqueda por nombre:** `Buscar` se resuelve con `CAPS(Nombre) MATCHES "*<texto>*"`, o sea **contiene**, no "empieza con". Al ser un `MATCHES` con comodín inicial no usa el índice `Idx-Nombre`, pero la tabla es chica y el costo es despreciable.
  4. **Solo lectura:** el servicio no escribe nada; es un `FOR EACH ... NO-LOCK`.
  5. **Catálogo pequeño:** no se paginó a propósito — el front lo consume como combo completo.
  6. **Autenticación:** servicio sobre OpenEdge PASOE; si el ambiente requiere Bearer, incluir `Authorization: Bearer <token>`.

  ---
