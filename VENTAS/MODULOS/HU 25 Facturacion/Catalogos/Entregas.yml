  ---

  ## 14. Observaciones Técnicas

  1. **Origen:** ayudas F2 `vtaf0010.p` (orden por `Id-Entrega`) y `vtaf0011.p` (orden por `Descr` + filtro `l-Ver`), ambas construidas con el include `seeksoft.i`. Las dos se consolidan en un solo endpoint con el parámetro `OrdenarPor`.
  2. **Solo activas:** `Entrega.Activo = TRUE`, igual que `&Where = "Entrega.Activo"` de la ayuda. La tabla tiene el índice `idx-act` (`Activo` + `Id-Entrega`) que acota la consulta.
  3. **Índices:** `idx-ent` (PRIMARY UNIQUE, `Id-Entrega`) e `idx-act`. *Nota:* la ayuda de carácter declara `USE-INDEX Idx-Entrega`, índice que **no existe** con ese nombre en el diccionario; el servicio usa cláusulas `BY` en lugar de `USE-INDEX` para no depender de nombres de índice.
  4. **Solo lectura:** el servicio no escribe nada; es un `FOR EACH ... NO-LOCK`.
  5. **Catálogo pequeño:** no se paginó a propósito — la tabla `Entrega` tiene pocos registros y el front lo consume como combo completo.
  6. **Autenticación:** servicio sobre OpenEdge PASOE; si el ambiente requiere Bearer, incluir `Authorization: Bearer <token>`.

  ---
