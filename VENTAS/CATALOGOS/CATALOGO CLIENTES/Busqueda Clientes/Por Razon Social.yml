  ---

  ## 14. Observaciones Técnicas

  1. **Por número (prefijo):** se recorren los rangos `[n, n]`, `[n·10, n·10+9]`, `[n·100, n·100+99]`, … hasta el último cliente, con `USE-INDEX idx-abcvendmail` (`Activo` + `Id-Cliente`): solo se leen clientes activos dentro del rango y se corta al llegar a `MaxReg`.
  2. **Por razón social:** `Cliente.RazonSocial BEGINS Filtro AND Activo` con `USE-INDEX Idx-RazonClie` (`RazonSocial`, `Id-Cliente`; índice normal porque un word-index solo puede tener un campo). Solo empata desde el inicio del nombre. Primero se llena con razón social y lo que falte hasta `MaxReg` se completa con correos, sin repetir clientes.
  3. **Por correo:** `idx-email` es un **word-index** (no admite `USE-INDEX` ni `BEGINS`, error 3594). Los candidatos se obtienen con `Cliente.e-mail CONTAINS "<primera palabra>*"` (letras/dígitos del filtro hasta el primer `@`, `.`, `_`, etc.: `juan.pe` → `juan*`) y dentro del ciclo se valida `Activo` y `e-mail BEGINS Filtro`. Sin distinguir mayúsculas. Si el filtro no empieza con letra o dígito: `"Escriba el correo desde el inicio."`
  4. **Orden de salida:** por `Id-Cliente` (índice primario de `ttCliente`).
  5. **Misma salida que `cliente.cls`:** usa `{cliente.i}` (`dsCliente` / `ttCliente`). Diferencias a propósito: `PassInternet` no se copia, y `Ciudad`/`Estado`/`Pais` salen de la ciudad de **cada** cliente (en `cliente.cls` el `FIND Ciudad` usaba el buffer `Cliente` de la BD en vez de `ttCliente`).
  6. **Sin auditoría** (`programas/auditoria.p`) a propósito: el front lo llama mientras se teclea.
  7. **Autenticación:** servicio sobre OpenEdge PASOE; si el ambiente requiere Bearer, incluir `Authorization: Bearer <token>`.

  ---
  **Desarrollado por:** SIS10 - JASS
